# 유연근무(출근시간 변경 — 자율출퇴근·시차출근) 신청 — HR 유연근무 신청서(FW). 출근과 퇴근이 한 묶음(8시간 고정)이라 출근시간이 곧 시간대다(src/attend.js FLEX_TIMES).
# 넣는 길(flexMode)은 셋(2026-10-02 사용자 지정): day 당일(Daily 표에 날짜 한 줄 — 날짜·출근시간·사유) · week 주간(Weekly 의 월~금 다섯 칸) · all 전체(다섯 칸에 같은 값).
# 주간·전체는 날짜도 사유도 받지 않고 결재되면 다음 주 월요일부터 반영된다. 07:00·11:00 출근은 월·금요일에만 있다(화~목 칸에는 그 선택지가 없다).
# 칸은 길에 따라 산다(when) — 관문이 거짓인 칸은 통째로 건너뛴다. 어느 길에 어떤 칸이 보이는지는 src/attend.js fieldsFor 가 정한다.
id: attend.flex
title: 유연근무 신청
hint: 유연근무
summary: '유연근무 {flexMode} {dateFrom} {flexStart}'
fields:
  flexMode:
    type: enum
    required: true
    values: [day, week, all]     # src/attend.js FLEX_MODES
    label: 기간
    desc: 넣는 길 — day(당일)·week(주간, 요일별)·all(전체, 월~금 모두 같은 시간)
    read: 유연근무를 넣는 길. day(당일)·week(주간·요일별)·all(전체·매일·월~금 모두)
    default: day
    example: day
  dateFrom:
    type: date
    required: true
    label: 날짜
    desc: 당일(day)의 그 날. 주말은 올릴 수 없고 화~목은 07:00·11:00 을 고를 수 없다(problems)
    read: '당일 유연근무의 날짜(YYYY-MM-DD). "내일"·"다음 주 수요일" 은 오늘을 기준으로 실제 날짜로'
    when: flexMode=day
    example: '2026-10-20'
  flexStart:
    type: enum
    required: true
    values: ['07:00', '08:00', '08:30', '09:00', '09:30', '10:00', '11:00']   # FLEX_TIMES 의 출근시간(07:00·11:00 은 월·금에만)
    label: 출근시간
    desc: 당일(day)·전체(all)의 새 출근시간 — 전체는 화~목에 없는 07:00·11:00 을 받지 않는다(flexFit)
    read: 유연근무의 새 출근시간(당일·전체일 때)
    when: flexMode!=week
    example: '08:00'
  purpose:
    type: string
    required: true
    max: 200
    label: 사유
    desc: 당일(day)의 사유 — Daily 표의 사유 칸(주간·전체는 받지 않는다)
    read: 당일 유연근무의 사유. 사용자가 말한 것만
    when: flexMode=day
    example: 병원 방문
  flexMon:
    type: enum
    required: true
    values: ['07:00', '08:00', '08:30', '09:00', '09:30', '10:00', '11:00']   # flexTimesFor(wide=true)
    label: 월
    desc: 주간(week)의 월요일 출근시간
    read: 주간 유연근무의 월요일 출근시간
    when: flexMode=week
  flexTue:
    type: enum
    required: true
    values: ['08:00', '08:30', '09:00', '09:30', '10:00']   # flexTimesFor(wide=false) — 화~목에는 07:00·11:00 이 없다
    label: 화
    desc: 주간(week)의 화요일 출근시간
    read: 주간 유연근무의 화요일 출근시간
    when: flexMode=week
  flexWed:
    type: enum
    required: true
    values: ['08:00', '08:30', '09:00', '09:30', '10:00']
    label: 수
    desc: 주간(week)의 수요일 출근시간
    read: 주간 유연근무의 수요일 출근시간
    when: flexMode=week
  flexThu:
    type: enum
    required: true
    values: ['08:00', '08:30', '09:00', '09:30', '10:00']
    label: 목
    desc: 주간(week)의 목요일 출근시간
    read: 주간 유연근무의 목요일 출근시간
    when: flexMode=week
  flexFri:
    type: enum
    required: true
    values: ['07:00', '08:00', '08:30', '09:00', '09:30', '10:00', '11:00']
    label: 금
    desc: 주간(week)의 금요일 출근시간
    read: 주간 유연근무의 금요일 출근시간
    when: flexMode=week
  op:
    type: enum
    required: true
    values: [save, request]
    label: 올리는 길
    desc: 임시저장(save)·결재요청(request) — 누른 버튼. 둘은 다른 확인이다(기록이 다르다)
    read: 사용자가 말로 고르지 않습니다 — 버튼이 정합니다(임시저장이면 save, 결재요청이면 request)
    llm: false
    ui: false
  doc:
    type: object
    label: 고쳐 올리는 문서
    desc: 임시저장해 둔 문서를 열어 고쳐 올릴 때 그 문서(없으면 새 신청 — buildJob 의 doc). 저장된 문서는 기간구분(Daily·Weekly)이 잠겨 있다
    read: 사용자가 정하지 않습니다 — 신청 내역에서 수정을 누른 문서
    llm: false
    ui: false
    fields:
      docNo: { type: string, max: 30, required: true, desc: 문서번호, read: 고치는 문서의 번호 그대로 }
      statusCode: { type: string, max: 2, desc: 결재 상태 코드(임시저장 1), read: 그 문서의 상태 코드 그대로 }
ignore:
  kind: 행위 ID 가 종류다(attend.flex)
  dateTo: 유연근무에는 기간이 없다(당일 하루 또는 주간)
  start: 시각 칸이 없다 — 출근시간(flexStart)이 시간대다
  end: 시각 칸이 없다
  span: 시각 칸이 없다
  days: 하루짜리
  place: 장소를 쓰지 않는 종류(applyPatch 가 버린다)
  venue: 장소를 쓰지 않는 종류
  workplace: 출장·외근의 칸
  expense: 출장·외근의 칸
  allDay: 건강검진의 칸
  file: 건강검진의 첨부
  settle: 출장의 여비계산서
  transport: 출장의 교통편
  trainGrade: 출장의 좌석 등급
  car: 출장·외근의 차량 조회
  carPlace: 외근의 차량 행선지
  sub: 유연근무에는 갈래가 없다
  half: 연차의 구분
  wfa: 연차의 기념일 지원
  wfaName: 연차의 기념일 지원
  wfaRelation: 연차의 기념일 지원
  wfaReason: 연차의 기념일 지원
  wfaDate: 연차의 기념일 지원
  wfaStayFrom: 연차의 기념일 지원
  wfaStayTo: 연차의 기념일 지원
  wfaPaid: 연차의 기념일 지원
  wfaAsk: 연차의 기념일 지원
  wfaCash: 연차의 기념일 지원
rules:
  - 'flex 는 유연근무(출근시간 변경. 자율출퇴근·시차출근이라고도 말합니다)입니다. 넣는 길(flexMode)은 셋입니다 — day(당일: 그 날 하루), week(주간: 월~금 요일마다), all(전체: 월~금 모두 같은 시간).'
  - 'flexMode 가 week 이면 말한 요일의 출근시간만 flexMon~flexFri 에 넣고 flexStart 는 null 입니다. day·all 이면 flexStart 를 쓰고 flexMon~flexFri 는 null 입니다.'
  - '07:00·11:00 출근은 월요일·금요일에만 있습니다.'
runner: attend.apply
uses:
  - { module: src/attend.js, export: buildJob }
  - { module: src/hr.js, export: hrRunJob }
next: 결재요청 뒤 HR 신청 내역에서 상태를 확인한다. 반차 앞에 올리는 유연근무(halfFlexForm — 출근이 정시가 아닌 날의 반차)도 같은 기록이다(패널이 휴가 기록 앞에 따로 짓는다)
