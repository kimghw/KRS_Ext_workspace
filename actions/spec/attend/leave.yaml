# 휴가 신청 — HR 휴가/공가 신청서(LV). 갈래(sub)는 LY 연차(반차 포함)·LH 체력단련(HR 에서는 "체력관리", 전일로 잠긴다). 연차·체력단련은 HR 이 사유를 받지 않는다.
# 시작일·종료일이 한 줄, 그 아래 며칠간 칩(1D~5D) 오른쪽에 오전·오후(2026-10-08 사용자 지정). 종료일은 며칠간에서 나오고 달력으로 고르면 며칠간이 따라 바뀐다.
# 구분(half)은 **하루짜리 연차**에만 있다(halfOf) — UI 의 오전·오후 칩은 am·pm 이고 전일은 빈 값이다. LLM 값(input.yaml)은 [am, pm, full] 이라 그것으로 적는다:
# UI 의 전일 '' ↔ 기록에는 없음(null), LLM 의 full 은 applyPatch 가 '' 로 받는다. 출근이 정시가 아닌 날의 반차는 유연근무(09:00~18:00)를 먼저 올린다(halfFlexForm — attend.flex 기록).
# 연차(LY)에는 "기념일 지원" 체크박스(wfa)가 붙는다(2026-10-08 사용자 지정) — eclass 복지기금의 직원 및 직원가족 기념일 지원 신청(src/welfare.js)이다. 연차는 HR 에 그대로 올라가고,
# 결재요청 뒤 그 신청 화면을 채워 연다(then 의 attend.welfare — 2단계). 기념일 칸(wfaName …)은 HR 에 가지 않고 그 화면에만 간다.
id: attend.leave
title: 휴가 신청
hint: 휴가
summary: '{sub} {dateFrom}~{dateTo} {days}일 {half}'
fields:
  sub:
    type: enum
    required: true
    values: [LY, LH]             # src/attend.js SUBS.leave
    label: 종류
    desc: 갈래 — LY(연차·반차)·LH(체력단련, HR 의 체력관리)
    read: leave 이면 LY(연차·반차)·LH(체력단련)
    default: LY
    example: LY
  dateFrom:
    type: date
    required: true
    label: 시작일
    desc: 시작일(연차휴가 사용일의 첫날)
    read: '시작일(YYYY-MM-DD). "내일"·"다음 주 수요일" 은 오늘을 기준으로 실제 날짜로'
    example: '2026-10-20'
  dateTo:
    type: date
    required: true
    label: 종료일
    desc: 종료일 — 며칠간(days)에서 나온다(settle/tripDates). 달력으로 고르면 며칠간이 따라 바뀐다
    read: '여러 날 휴가의 종료일(YYYY-MM-DD). 하루면 null'
    example: '2026-10-21'
  days:
    type: integer
    required: true
    min: 1
    max: 31                      # src/attend.js MAX_TRIP_DAYS — 출장과 같은 한도
    label: 며칠간
    desc: '며칠간(하루 1) — 칩 1D~5D(2026-10-02 사용자 지정), 그보다 길면 종료일 달력에서'
    read: '며칠간인지(하루 1, 이틀이면 2). "3일간" 처럼 기간으로 말했을 때'
    default: 1
    example: 2
  half:
    type: enum
    values: [am, pm, full]       # UI 는 am·pm 칩뿐이고 전일은 빈 값(기록에 없음). full 은 LLM 이 "하루 종일" 을 말할 때 — applyPatch 가 '' 로 받는다
    label: 구분
    desc: 하루짜리 연차의 구분 — am(오전 반차)·pm(오후 반차)·전일(빈 값). 여러 날이거나 체력단련이면 전일로 잠긴다(locked)
    read: 하루짜리 연차의 구분. am(오전 반차)·pm(오후 반차)·full(전일). 휴가가 아니면 null
    example: am
  wfa:
    type: boolean
    label: 기념일 지원
    desc: 가족 기념일(생일·결혼기념일·어린이날 …)에 쓰는 연차면 켠다 — 결재요청 뒤 eclass 의 가족 기념일 지원 신청 화면을 채워 연다(src/welfare.js). 연차(LY)에만 있다
    read: '연차를 가족 기념일(생일·결혼기념일·어린이날 …)에 쓰는가 — "기념일"·"기념일 지원" 이라고 말했을 때만 true. 그 밖에는 null'
    default: false
    when: sub=LY
  # 아래 기념일 칸은 체크박스를 켰을 때 연차 칸 아래에 붙는다(src/welfare.js welfareFields). 기념일의 내용은 폼의 칸에서 적으므로 LLM 은 넣지 않는다(llm: false).
  wfaReason:
    type: enum
    required: true
    values: [생일(양력), 결혼기념일, 자녀 입학식, 자녀 졸업식, 자녀 방학, 신정, 어린이날, 어버이날, 세계가정의날, 부부의날, 부처님오신날, 창립기념일, 노조 창립기념일, 추석, 크리스마스, 설날, 생일(음력)]   # src/welfare.js REASONS — 신청 화면의 RadComboBox 그대로
    label: 신청사항
    desc: 신청사항(기념일의 종류)
    read: 어떤 기념일인지 — 목록의 이름 그대로
    llm: false
    when: wfa
  wfaDate:
    type: date
    required: true
    label: 기념일
    desc: 기념일 날짜
    read: 기념일(YYYY-MM-DD)
    llm: false
    when: wfa
  wfaName:
    type: string
    required: true
    max: 50
    label: 대상자
    desc: 대상자(본인 또는 가족 이름)
    read: 기념일의 대상자 이름
    llm: false
    when: wfa
  wfaRelation:
    type: enum
    required: true
    values: [본인, 배우자, 부모, '형제,자매', 자녀, 배우자 부모]   # src/welfare.js RELATIONS
    label: 가족관계
    desc: 대상자와의 관계
    read: 대상자와의 관계 — 목록의 이름 그대로
    default: 본인
    llm: false
    when: wfa
  wfaStayFrom:
    type: date
    label: 시설 시작일
    desc: 시설 이용 시작일(숙박 등 — 없으면 비운다. 시작·종료를 같이 적는다)
    read: 시설을 이용했으면 그 시작일(YYYY-MM-DD)
    llm: false
    when: wfa
  wfaStayTo:
    type: date
    label: 시설 종료일
    desc: 시설 이용 종료일
    read: 시설을 이용했으면 그 종료일(YYYY-MM-DD)
    llm: false
    when: wfa
  wfaPaid:
    type: string
    max: 20
    label: 결제금액
    desc: 결제금액(원 — 영수증 금액. 쉼표·원은 걷는다 wonOf). 다녀온 뒤에야 알면 비워 두고 신청 화면에서 적는다
    read: 영수증의 결제 금액(숫자만)
    llm: false
    when: wfa
  wfaAsk:
    type: string
    max: 20
    label: 신청금액
    desc: 신청금액(원 — 이용일당 150,000 까지, src/welfare.js WFA_MAX). 결제금액을 넘을 수 없다
    read: 신청할 금액(숫자만, 150000 까지)
    llm: false
    when: wfa
  wfaCash:
    type: enum
    values: ['1', '2', '3']      # src/welfare.js CASH_KINDS — 1 현금영수증 · 2 신용카드 · 3 체크카드(계좌이체는 지원받을 수 없다)
    label: 사용구분
    desc: 결제 수단 — 1(현금영수증)·2(신용카드)·3(체크카드)
    read: 현금영수증이면 1, 신용카드면 2, 체크카드면 3
    llm: false
    when: wfa
  op:
    type: enum
    required: true
    values: [save, request]
    label: 올리는 길
    desc: 임시저장(save)·결재요청(request) — 누른 버튼. 둘은 다른 확인이다(기록이 다르다)
    read: 사용자가 말로 고르지 않습니다 — 버튼이 정합니다(임시저장이면 save, 결재요청이면 request)
    llm: false
    ui: false
  doc:
    type: object
    label: 고쳐 올리는 문서
    desc: 임시저장해 둔 문서를 열어 고쳐 올릴 때 그 문서(없으면 새 신청 — buildJob 의 doc)
    read: 사용자가 정하지 않습니다 — 신청 내역에서 수정을 누른 문서
    llm: false
    ui: false
    fields:
      docNo: { type: string, max: 30, required: true, desc: 문서번호, read: 고치는 문서의 번호 그대로 }
      statusCode: { type: string, max: 2, desc: 결재 상태 코드(임시저장 1), read: 그 문서의 상태 코드 그대로 }
ignore:
  kind: 행위 ID 가 종류다(attend.leave)
  start: 휴가에는 시각 칸이 없다 — 시각으로 말하면 오전·오후로 읽는다(halfFromTimes)
  end: 휴가에는 시각 칸이 없다
  span: 휴가에는 시각 칸이 없다
  place: 휴가에는 장소·목적이 없다
  venue: 휴가에는 장소·목적이 없다
  purpose: 연차·체력단련은 HR 이 사유를 받지 않는다(사유 줄이 숨어 있다)
  workplace: 출장·외근의 칸
  expense: 출장·외근의 칸
  flexStart: 유연근무의 칸
  flexMode: 유연근무의 칸
  flexMon: 유연근무의 칸
  flexTue: 유연근무의 칸
  flexWed: 유연근무의 칸
  flexThu: 유연근무의 칸
  flexFri: 유연근무의 칸
  allDay: 건강검진의 칸
  file: 건강검진의 첨부
  settle: 출장의 여비계산서
  transport: 출장의 교통편
  trainGrade: 출장의 좌석 등급
  car: 출장·외근의 차량 조회
  carPlace: 외근의 차량 행선지
rules:
  - '휴가(leave)의 sub 는 LY(연차·반차) 또는 LH(체력단련·체력관리)이고, 그냥 "휴가"라고만 했으면 sub 는 null 입니다.'
  - '"오전 반차"·"오후 반차"는 half 에 am·pm 을, 하루 종일이라고 했으면 full 을 넣습니다. 휴가에는 장소·목적이 없습니다.'
  - '"가족 기념일"·"기념일 지원"·"결혼기념일에 연차" 처럼 기념일을 말했으면 kind 는 leave, sub 는 LY, wfa 는 true 입니다. 기념일의 내용(대상자·신청사항·금액)은 폼의 칸에서 적으므로 넣지 않습니다.'
checks:
  - { left: dateFrom, op: '<=', right: dateTo, drop: dateTo, message: 종료일이 시작일보다 앞서 종료일은 뺐습니다 }
  - { left: wfaStayFrom, op: '<=', right: wfaStayTo, message: 시설 종료일이 시작일보다 앞섭니다 }
runner: attend.apply
uses:
  - { module: src/attend.js, export: buildJob }
  - { module: src/hr.js, export: hrRunJob }
then:
  - { action: attend.welfare, when: wfa }
next: 결재요청 뒤 HR 신청 내역에서 상태를 확인한다. 기념일 지원을 켰으면 eclass 의 신청 화면을 채워 연다(attend.welfare — 2단계까지는 attendpanel.js fillWelfare 가 바로 한다)
