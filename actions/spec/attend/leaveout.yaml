# 외출(근무 중 잠시 나갔다 옴) 신청 — HR 기타 신청서(ET, 근태종류 ZLO). 하루 안에서 끝나는 종류라 시작과 몇 시간(span)을 받고 종료 시각은 거기서 나온다(settle).
# 시각은 30분 단위(2026-10-02 사용자 지정). HR 에는 시작일(=종료일)·시작/종료 시각·사유(reqRsn)가 간다(src/attend.js buildJob 의 etc).
id: attend.leaveout
title: 외출 신청
hint: 외출
summary: '외출 {dateFrom} {start}~{end} · {purpose}'
fields:
  dateFrom:
    type: date
    required: true
    label: 날짜
    desc: 날짜(하루짜리)
    read: '날짜(YYYY-MM-DD). "내일"·"다음 주 수요일" 은 오늘을 기준으로 실제 날짜로'
    example: '2026-10-20'
  start:
    type: time
    required: true
    label: 시작
    desc: 시작 시각(30분 단위)
    read: '시작 시각 HH:MM(30분 단위). 말하지 않았으면 null'
    default: '09:00'             # 오전 9시(2026-10-02 사용자 지정 — src/attend.js DEFAULT_START)
    example: '14:00'
  span:
    type: integer
    required: true
    min: 30
    max: 510                     # 1~8시간 칩 + 30분 칩(src/attend.js SPAN_HOURS·nextSpan)
    label: 몇 시간
    desc: '몇 분인지(칩). 종료 시각(end)은 시작 + 이것이다. LLM 은 end 로 말한다(llm: false)'
    read: 사용자가 정하지 않습니다 — end(끝나는 시각)에서 폼이 셈합니다
    llm: false
  end:
    type: time
    label: 종료
    desc: 종료 시각 — 화면 칸이 아니고 시작 + 몇 시간에서 나온다(settle). HR 에는 이것이 간다
    read: '종료 시각 HH:MM. "2시부터 3시간" 처럼 길이로 말했으면 셈해서'
    ui: false
    example: '16:00'
  purpose:
    type: string
    required: true
    max: 200
    label: 사유
    desc: 사유(HR 의 reqRsn)
    read: 사유. 사용자가 말한 것만 — 지어내지 않습니다
    example: 병원 방문
  op:
    type: enum
    required: true
    values: [save, request]
    label: 올리는 길
    desc: 임시저장(save)·결재요청(request) — 누른 버튼. 둘은 다른 확인이다(기록이 다르다)
    read: 사용자가 말로 고르지 않습니다 — 버튼이 정합니다(임시저장이면 save, 결재요청이면 request)
    llm: false
    ui: false
  doc:
    type: object
    label: 고쳐 올리는 문서
    desc: 임시저장해 둔 문서를 열어 고쳐 올릴 때 그 문서(없으면 새 신청 — buildJob 의 doc)
    read: 사용자가 정하지 않습니다 — 신청 내역에서 수정을 누른 문서
    llm: false
    ui: false
    fields:
      docNo: { type: string, max: 30, required: true, desc: 문서번호, read: 고치는 문서의 번호 그대로 }
      statusCode: { type: string, max: 2, desc: 결재 상태 코드(임시저장 1), read: 그 문서의 상태 코드 그대로 }
ignore:
  kind: 행위 ID 가 종류다(attend.leaveout)
  dateTo: 하루짜리 — settle 이 시작일로 맞추고 HR 에는 시작일이 종료일로 간다
  days: 하루짜리
  place: 장소를 쓰지 않는 종류(applyPatch 가 버린다)
  venue: 장소를 쓰지 않는 종류
  workplace: 출장·외근의 칸
  expense: 출장·외근의 칸
  flexStart: 유연근무의 칸
  flexMode: 유연근무의 칸
  flexMon: 유연근무의 칸
  flexTue: 유연근무의 칸
  flexWed: 유연근무의 칸
  flexThu: 유연근무의 칸
  flexFri: 유연근무의 칸
  allDay: 건강검진의 칸
  file: 건강검진의 첨부
  settle: 출장의 여비계산서
  transport: 출장의 교통편
  trainGrade: 출장의 좌석 등급
  car: 출장·외근의 차량 조회
  carPlace: 외근의 차량 행선지
  sub: 외출에는 갈래가 없다
  half: 연차의 구분
  wfa: 연차의 기념일 지원
  wfaName: 연차의 기념일 지원
  wfaRelation: 연차의 기념일 지원
  wfaReason: 연차의 기념일 지원
  wfaDate: 연차의 기념일 지원
  wfaStayFrom: 연차의 기념일 지원
  wfaStayTo: 연차의 기념일 지원
  wfaPaid: 연차의 기념일 지원
  wfaAsk: 연차의 기념일 지원
  wfaCash: 연차의 기념일 지원
rules: []
runner: attend.apply
uses:
  - { module: src/attend.js, export: buildJob }
  - { module: src/hr.js, export: hrRunJob }
next: 결재요청 뒤 HR 신청 내역에서 상태를 확인한다(confirmInList)
