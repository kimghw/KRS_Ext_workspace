# 게시판 갈래 — e-Class 게시판(BoardNew)에 글을 올린다. 지금은 국제표준 하나 — 공문 탭의 국제표준 업로드 칸(stdbox.js)이 넣은 표준 PDF 하나마다
# board.standard 기록 하나를 지어 디스패처로 보낸다(2026-10-30 사용자 지정: "양식 공문이력 다음에 국제표준 업로드 할 수 있도록 해주고 pdf 표준 주면 업로드 해주고 …
# zip 이면 풀어서 업로드 하고, pdf 여러개 주면 자동 업로드 해주고"). 실행기는 src/stdboard.js(쓰기 화면이 하는 차례 — 첨부 컴포넌트로 파일을 올리고 글을 저장)이고
# 이 명세는 그 앞의 기록의 꼴이다(actions/runners/board.js).
#
# LLM 작업은 만들지 않는다(mode none — 표준번호·표준명은 PDF 의 메타데이터·표지에서 규칙으로 읽는다, src/stdboard.js stdFromPdf). 그래도 칸마다 read 는 둔다 —
# 2단계 통합 명령창에서 LLM 이 칸 값을 제안할 때 쓴다(2026-10-16 사용자 지정: "사용자가 입력하는 칸도 나중에 LLM 을 넣을 수 있게 read 를 준다").
domain: board
title: 게시판
log: board                     # 활동 로그 kind(src/logbook.js KIND_LABEL — '게시판')
kinds: [standard]
preset:
  me: { from: me, desc: 내 이름(패널 설정의 myName — 기록에만 남는다. 글의 작성자는 로그인한 사람으로 사이트가 정한다) }
llm:
  task: board                  # 이름만 맡아 둔다 — mode none 이라 작업은 만들지 않는다
  mode: none
