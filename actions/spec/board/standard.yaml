# 국제표준 올리기 — e-Class 「Standard Documents」 게시판(46V4)에 표준 PDF 하나를 글 하나로. 공문 탭의 국제표준 업로드 칸(stdbox.js)에 끌어 놓거나 골라 넣은 것이
# 확인이다(넣은 PDF·ZIP 안의 PDF 마다 이 기록을 하나씩 지어 차례로 돌린다 — 실행기 하나가 표준 하나). 파일 바이트는 ctx.bytes.
# 게시판의 관례(2026-10-23 수소전기추진연구팀이 올린 글들)를 따른다: 제목·본문은 '표준번호 - 표준명', 분류는 표준(standard) › ISO·IEC·EN·KS·기타(IEEE 등 분류가 없는 것),
# 작성자는 로그인한 사람(사이트가 정함) — 이름을 부서로 보일지(writershow D, 기본)·내 이름으로 보일지(P)만 고른다.
# 실행기(src/stdboard.js stdUpload)는 먼저 게시판을 제목으로 찾아 같은 표준번호의 글이 있으면 올리지 않고(exists), 없으면 쓰기 화면이 하는 차례 그대로
# 첨부 컴포넌트(DraftFileUp)로 파일을 올린 뒤 글을 저장(TempWrite)하고, 게시판을 다시 찾아 새 글의 번호를 확인한다. 고치기·지우기는 하지 않는다.
id: board.standard
title: 국제표준 올리기
hint: Standard Documents 게시판에 표준 하나
confirm: true                  # 칸에 끌어 놓거나 골라 넣은 누름이 확인이다
effect: write
summary: '국제표준 {designation} 올리기'
fields:
  designation:
    type: string
    required: true
    max: 80
    label: 표준번호
    desc: '표준번호와 연도(IEC TS 63336:2024 · IEEE 2800.2-2026 · ISO 20421-2:2017) — 표지의 참조 번호, 없으면 파일 이름에서. 같은 글이 있는지 이것으로 찾는다'
    read: 표지에 적힌 표준번호와 발행 연도 그대로. 지어내지 않습니다
    example: IEC TS 63336:2024
  title:
    type: string
    required: true
    max: 300
    label: 표준명
    desc: 영문 표준명 — IEEE 는 PDF 메타데이터의 제목, IEC·ISO 는 표지의 종류 줄(INTERNATIONAL STANDARD·TECHNICAL REPORT …) 다음 영문 줄. 프랑스어 제목은 넣지 않는다
    read: 표지의 영문 표준명 그대로(부·Part 포함). 모르면 null
    example: Commissioning of VSC HVDC systems
  category:
    type: enum
    required: true
    values: [ISO, IEC, EN, KS, ETC]
    label: 분류
    desc: '게시판 분류 표준(standard) 아래 — ISO 108 · IEC 109(IEC/IEEE 공동 포함) · EN 110 · KS 111 · ETC 는 기타 112(IEEE·ASTM 등)'
    read: 표준을 낸 기관(ISO·IEC·EN·KS). 그 밖이면 ETC
    default: ETC
    example: IEC
  writer:
    type: enum
    values: [dept, me]
    label: 작성자 표시
    desc: 게시판에 보일 작성자 — dept 부서 이름(쓰기 화면의 Indicate as Department, 기본 — 게시판 관례) · me 내 이름. 작성자 자체는 로그인한 사람이다
    read: 내 이름으로 보이라면 me, 아니면 dept
    default: dept
    example: dept
  file:
    type: file
    required: true
    label: 표준 파일
    desc: 올릴 PDF 의 참조(이름·형식·크기 — 바이트는 ctx.bytes). ZIP 으로 넣었으면 그 안의 PDF 하나
    read: 표준 PDF 의 이름과 형식. 지어내지 않습니다
    llm: false
llm: false
runner: board.standard
uses:
  - { module: src/stdboard.js, export: stdUpload }
next: 결과({ ok, status posted·exists·unverified, id, url, subject, note })로 칸이 그 파일의 줄에 적는다(올림 — 글 번호 링크 · 이미 있음 — 그 글 링크 · 확인 못 함). 넣은 것을 다 돌리면 칸의 요약에 올린 수를 적는다
