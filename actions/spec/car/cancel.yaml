# 차량 신청 취소 — 격자에서 고른 내 신청(cancelPicked)이나 내 예약 목록의 한 건(cancelFromMine)을 지운다(RUNNERS.car.cancel(record, day)).
# 차량의 삭제 손잡이는 행 자리로 지은 버튼 이름이라(RG_MAIN$ctl00$…$BTN_DEL) 새로 읽은 화면에서 다시 찾은 것만 쓴다 — 산 손잡이(record)와 화면(day)은 ctx 다(§5).
# 기록에는 무엇을 지우는지(차량·날짜·시간·행선지)만 둔다. 취소 버튼(두 번 확인)이 확인이다.
id: car.cancel
title: 차량 신청 취소
log: cancel
summary: '{car} {date} {start}~{end}'
fields:
  car:
    type: string
    required: true
    max: 100
    label: 차량
    desc: 차량 이름
    read: 취소할 신청의 차량 이름 그대로
    example: 카니발(12가 3456)
  date:
    type: date
    required: true
    label: 이용일
    desc: 이용일(시작일)
    read: 취소할 신청의 이용일(YYYY-MM-DD)
    example: '2026-10-20'
  start:
    type: time
    required: true
    label: 시작
    desc: 시작 시각
    read: 취소할 신청의 시작 시각 HH:MM
    example: '09:00'
  end:
    type: time
    required: true
    label: 종료
    desc: 종료 시각
    read: 취소할 신청의 종료 시각 HH:MM
    example: '18:00'
  endDate:
    type: date
    label: 반납일
    desc: 여러 날에 걸친 신청의 마지막 날. 하루면 비운다
    read: 여러 날 신청이면 마지막 날(YYYY-MM-DD). 하루면 null
  title:
    type: string
    max: 100
    label: 사용목적
    desc: 그 신청의 사용목적(기록용)
    read: 그 신청의 사용목적. 모르면 null
  place:
    type: string
    max: 100
    label: 행선지
    desc: 그 신청의 행선지(기록용)
    read: 그 신청의 행선지. 모르면 null
checks:
  - { left: date, op: '<=', right: endDate, message: 반납일이 이용일보다 앞섭니다 }
llm: false
runner: booking.cancel
uses:
  - { module: src/runners.js, export: RUNNERS }
next: 지운 뒤 걸친 날을 모두 다시 읽는다(forgetDays → load). 내 예약 목록에서 지웠으면 justBooked 에서도 뺀다(패널)
