# 차량 말로 찾기 — 회의실의 search 와 같은 길(src/llm.js parseSmart → src/search.js findSlots, loader 는 RUNNERS.car.loadDay). 조회뿐이라 confirm 없음·effect none.
# 칸은 references/input.yaml 의 parse 와 같다. 차량에는 좌석 정보가 없고 지역을 가리지 않으므로 minSeats·region 은 `drop` 이다 — 행위의 기록 칸에서는 빠지고,
# 생성된 작업 search.car 에는 칸으로 들어가되 variants.car.clear 로 비우고 알린다(관문 src/input.js structure — 인원 조건을 그대로 두면 모든 차가 걸러진다).
id: car.search
title: 차량 빈 시간 찾기
hint: 업무용 차량
confirm: false
effect: none
log: ask
summary: '{summary}'
preset:
  today: { from: today, desc: 오늘(YYYY-MM-DD) — 날짜가 없으면 오늘 하루를 본다 }
fields:
  dateFrom:
    type: date
    label: 조회 시작일
    required: true
    desc: 조회 시작일
    read: 조회 시작일(YYYY-MM-DD). 날짜가 없으면 오늘
    example: '2026-10-20'
  dateTo:
    type: date
    label: 조회 종료일
    required: true
    desc: 조회 종료일(포함)
    read: 조회 종료일(YYYY-MM-DD, 포함). 날짜가 하나면 시작일과 같은 날
    example: '2026-10-21'
  hourFrom:
    type: integer
    label: 조회 시작 시
    required: true
    min: 0
    max: 23
    desc: 하루 중 조회 시작 시
    read: 하루 중 조회 시작 시(0~23). 시간대가 없으면 9
    example: 9
  hourTo:
    type: integer
    label: 조회 종료 시
    required: true
    min: 1
    max: 24
    desc: 하루 중 조회 종료 시
    read: 하루 중 조회 종료 시(1~24). 시간대가 없으면 18
    example: 18
  minSeats:
    type: integer
    label: 최소 좌석 수
    min: 1
    max: 999
    desc: 필요한 최소 좌석 수 — 차량에는 좌석 정보가 없어 받지 않는다(drop)
    read: 차량에는 좌석 정보가 없으므로 항상 null
    drop: 차량은 좌석 수를 알 수 없어 인원 조건은 뺐습니다
  minHours:
    type: number
    label: 최소 시간
    min: 0.5
    max: 24
    desc: 연속으로 필요한 최소 시간
    read: '"2시간짜리" 처럼 필요한 길이가 나오면 그 시간. 없으면 null'
    example: 2
  region:
    type: enum
    label: 지역
    values: [부산, 서울]
    desc: 지역 — 차량은 지역을 가리지 않아 받지 않는다(drop)
    read: 차량은 지역을 가리지 않으므로 항상 null
    drop: 차량은 지역을 가리지 않아 지역 조건은 뺐습니다
  summary:
    type: string
    label: 요약
    required: true
    max: 200
    desc: 해석한 조건을 한 줄로 요약(한국어)
    read: 사용자가 확인할 수 있게 해석 결과를 한 줄로(한국어)
    example: 10/20~21 2시간
checks:
  - { left: dateFrom, op: '<=', right: dateTo, message: 종료일이 시작일보다 앞섭니다 }
  - { left: hourFrom, op: '<', right: hourTo, message: 종료 시가 시작 시보다 늦어야 합니다 }
rules:
  - 날짜가 없으면 오늘 하루만 조회합니다(dateFrom = dateTo = 오늘).
  - '"내일", "이번 주", "다음 주" 같은 표현은 오늘을 기준으로 실제 날짜로 바꿉니다.'
  - 연도가 없으면 오늘과 같은 해로 봅니다.
  - 시간대가 없으면 hourFrom 9, hourTo 18 로 둡니다.
  - '차량에는 좌석 정보가 없으므로 minSeats 는 항상 null 입니다. 지역도 가리지 않으므로 region 은 항상 null 입니다.'
  - '"2시간짜리" 처럼 필요한 길이가 나오면 minHours 에 넣습니다.'
  - summary 는 사용자가 확인할 수 있게 해석 결과를 한 줄로 적습니다.
llm: { task: search.car }      # per-kind 작업의 이름 — src/llm.js parseSmart 가 kind car 일 때 부른다
runner: booking.search
uses:
  - { module: src/search.js, export: findSlots }
next: 후보를 화면에 보인다(renderFound) → 사용자가 누르면 그 탭·날짜로 옮겨 칸을 골라 두고(applyFound) 신청은 car.reserve 다
