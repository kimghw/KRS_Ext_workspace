# 회람 갈래 — DOC-Cruiser 의 미회람 문서를 하루에 한 번, 화면을 띄우지 않고 열어 회람 처리한다(src/circulate.js). 2단계(§12, status planned).
# 문서 보기 팝업 주소를 받기만 해도 서버가 읽은 시각을 적는다(2026-10-01 실제로 확인) — 건마다 그 주소를 한 번씩 부른다. 사이트의 "전부 회람 처리" 버튼은 쓰지 않는다.
# 도는 자리는 e-Class 홈의 콘텐츠 스크립트(home.js — 홈 카드가 하루 한 번 훑는 그 자리)다. 기본은 꺼져 있다 — 읽지 않은 공문을 읽은 것으로 바꾸는 되돌릴 수 없는 일이라
# 패널의 "설정 → 일반" 에서 본인이 켠 브라우저에서만 돈다(storage 의 docCirculate). 1단계에서 콘텐츠 스크립트는 actions/ 를 읽지 않는다 — 2단계에 주입한다. LLM 작업은 없다.
domain: circulate
title: 회람
log: circulate                 # src/logbook.js KIND_LABEL 의 '회람' — runDaily 가 지금 남기는 kind
kinds: [run]
preset:
  today: { from: today, desc: 오늘(YYYY-MM-DD) — 하루에 한 번의 기준(docCirculateState 의 date) }
llm:
  task: circulate
  mode: none
