# 미회람 문서 열람 — 설정이 켜져 있고 오늘 아직 안 했으면 한 번 돈다(src/circulate.js runDaily → circulateAll): 목록을 받아 건마다 보기 주소를 한 번씩 부르고(한꺼번에 셋), 다 돈 뒤 목록을 다시 받아
# 열었는데도 남아 있는 건이 있으면 그렇다고 말한다(describeResult). 오늘 끝낸 기록이 있으면 건너뛰고(force 면 다시 — 설정을 방금 켰을 때), 다른 탭이 돌고 있으면 건너뛴다(표식이 묵었으면 이어받는다).
# 사람이 누르지 않아도 돈다(confirm false, by auto) — 켜 둔 설정이 승낙이다. 되돌릴 수 없는 쓰기다(effect write). 설정을 끄면 도는 중이라도 다음 문서로 넘어가기 전에 멈춘다(signal — ctx).
id: circulate.run
title: 미회람 문서 열람
status: planned
confirm: false                 # 설정(docCirculate)을 켠 것이 승낙이다 — 홈을 열 때 저절로 돈다
effect: write
summary: '미회람 문서 열람'
preset:
  enabled: { from: storage:docCirculate, type: boolean, desc: 쓸지 — 패널의 "설정 → 일반" 체크박스(켠다고 한 적이 없으면 끈 것). 거짓이면 어댑터가 돌지 않는다(skipped off) }
fields:
  force: { type: boolean, label: 오늘 했어도 다시, desc: 오늘 끝낸 기록이 있어도 다시 돈다(설정을 방금 켰을 때 — startCirculate 의 kick(true)), read: '다시 돌라고 했을 때만 true' }
llm: false
runner: circulate.run
uses:
  - { module: src/circulate.js, export: runDaily }
  - { module: src/circulate.js, export: circulateAll }
  - { module: src/circulate.js, export: describeResult }
next: 결과를 활동 로그(circulate — 열 것이 없던 날이 이어지면 같은 줄을 쌓지 않는다)와 상태(docCirculateState — date·state·text·total·opened·remaining)에 적는다. 패널의 설정 화면이 상태를 보인다
