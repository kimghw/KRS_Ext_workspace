id: flight.search
title: 항공편 조회
hint: 대한항공·에어부산
confirm: false
effect: none
summary: '항공 {airline} {from}→{to} {date} {hour}시~ 성인 {adults}명'
fields:
  airline:
    type: enum
    required: true
    label: 항공사
    values: [all, KE, BX]
    default: all
    desc: 두 항공사 또는 대한항공(KE)·에어부산(BX)
    read: 대한항공은 KE, 에어부산은 BX, 둘 다 조회하면 all
    example: all
  from:
    type: string
    required: true
    label: 출발 공항
    default: PUS
    desc: 출발 공항 IATA 코드
    read: 김해 PUS, 김포 GMP, 인천 ICN, 제주 CJU 등 세 글자 공항 코드
    example: PUS
  to:
    type: string
    required: true
    label: 도착 공항
    default: GMP
    desc: 도착 공항 IATA 코드
    read: 세 글자 도착 공항 코드
    example: GMP
  date:
    type: date
    required: true
    label: 출발일
    desc: 편도 출발일 — 패널 상단 날짜
    read: 출발일(YYYY-MM-DD)
    example: '2026-11-12'
  hour:
    type: integer
    required: true
    label: 출발 시
    min: 0
    max: 23
    default: 8
    desc: 출발지 현지 시각 기준 결과 필터
    read: 이 시각 이후 출발편을 본다
    example: 8
  adults:
    type: integer
    required: true
    label: 성인 인원
    min: 1
    max: 9
    default: 1
    desc: 편도 일반석 성인 인원
    read: 성인 인원(1~9)
    example: 1
rules:
  - 공항 코드·같은 구간·지난 날짜를 실행기에서 검사한다.
  - 좌석 확인 실패와 매진은 구별하며 좌석 수를 추측하지 않는다.
llm: false
runner: flight.search
uses:
  - { module: src/flights.js, export: flightSearch }
next: 항공사별 조회 결과 → 공식 예약 페이지 열기. 예약과 결제는 항공사에서 진행한다.
