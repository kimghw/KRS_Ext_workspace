# 외부강의등 신고서 작성 — 강의·자문·심사·발표·위원 위촉 요청 공문·초청장·요청 메일을 읽어(gongmun.outside) 신고서의 칸(요청인·주제·장소·일시·사례금 …)을 채운 뒤
# 공문 탭의 `공문 작성` 을 누르면 이 기록이 선다(gongmunpanel.js writeDoc, 2026-10-15 사용자 지정: "현재 외부활동이 외부강의등 신고서인데 이 양식대로 작성하도록").
# 칸 하나가 신고서 칸 하나다(레시피 kr_outside_lecture_report/fieldmap.yaml 의 source: draft — writePlan 의 values.draft). 사유 쓰기 작업은 없다(RECIPE.tasks 에 gongmunReason.outside 없음 —
# 신고서에는 사유 칸이 없다). 과제를 고르지 않는다(purpose.yaml project: false — 신고서에 과제 칸이 없고 결재선은 담당 → 팀장뿐, 지난 신고서 HER-2026-000266 실측) — project 사전설정도,
# 결재선의 lead·refs 칸도 없다. 직급·당월 누적·당해 연도 누적은 공문 이력의 지난 신고서로 패널이 셈한다(outsideAuto). 문서설정 프로파일은 외부활동(보존 3년·키워드 '외부활동').
# 어댑터(gongmun.write): writePlan('outside', { title, body, draft, form, setting, rank } = rec.input, { me, preset: setup, today } = rec.preset) → writeGongmun(plan, { files: ctx.files, … }).
# 공통 칸과 공문 설정(setup)은 _domain.yaml 에 있다 — `{ from: domain }` 이 같은 자리에 가져온다. 양식(form)은 신고서가 기본이라 여기 통째로 적는다.
id: gongmun.outside
title: 외부강의등 신고서 작성
summary: '{preset.kindTitle} · {title}'
preset:
  kindTitle: { from: recipe:purposes.outside.title, desc: 갈래 이름(레시피 purpose.yaml 의 title — 외부강의등 신고서) — 활동 로그 한 줄에 쓴다 }
fields:
  # 양식 — 공통 칸과 같은 꼴(글 — 목록에 없는 ID 는 창만 연다)인데 기본값이 신고서라 통째로 적는다.
  form:
    type: string
    required: true
    max: 60
    default: KR_Outside_Lecture_Report
    label: 양식
    desc: eclass 전자결재 양식 ID(formsFor('outside') — 외부강의등 신고서 KR_Outside_Lecture_Report 가 기본. 연구업무추진품의·기안문은 본문 틀로 쓸 때)
    read: '양식 — 외부강의등 신고서(KR_Outside_Lecture_Report)가 기본'
  title:   { from: domain }
  # 본문 — 신고서는 본문 편집기가 없어 칸마다 넣는다(공문 탭의 본문 칸은 넣을 칸의 미리보기). 양식을 연구업무추진품의·기안문으로 바꿨을 때만 본문이 있고 꼭 있어야 한다(when).
  body:
    type: string
    required: true
    max: 20000
    label: 본문
    desc: 본문 — 양식을 본문 편집기가 있는 것(연구업무추진품의·기안문)으로 바꿨을 때만. 신고서(KR_Outside_Lecture_Report)에서는 칸이 없어 기록에도 없다(공문 탭의 본문 칸은 미리보기)
    read: 본문 틀을 채운 글
    llm: false
    when: form!=KR_Outside_Lecture_Report
  # 초안 — 레시피 outside/purpose.yaml 의 fields(org·representative·contact·contactTel·subject·place·from·to·start·end·hours·mins·fee·expenses·rank·monthCount·yearTotal·note)를 생성기가 펼치고
  # currency·attach 를 더한다(reads 는 없다). 신고서 칸에 넣는 값은 writePlan 의 draftValue(날짜·시각·숫자만 칸)가 고른다.
  draft:
    type: object
    from: recipe
    label: 초안
    desc: 초안 칸(레시피 purpose.yaml 의 fields — 생성기가 펼친다). 읽은 문서(gongmun.outside)가 채우고 직급·누적은 패널이 셈하며 사람이 고친다
    read: 읽은 문서로 채운 신고서의 칸
  rank:    { from: domain }
  setting: { from: domain }
  attach:  { from: domain }
llm:
  tasks:
    - { task: gongmun.outside, fills: draft }
runner: gongmun.write
uses:
  - { module: src/gongmun.js, export: writePlan }
  - { module: src/gmwrite.js, export: writeGongmun }
next: 뒤 탭에 신고서를 쓴다(제목·신고서 칸·문서설정·결재선·첨부 — 차수 칸이 없는 양식이라 제목만). ok 는 steps 에 ok false 가 없을 때다. 임시저장·상신은 사람이 창에서 한다
