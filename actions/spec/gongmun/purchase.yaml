# 구매품의(연구업무추진품의) 작성 — 견적서·거래명세서·쇼핑몰 주문 화면을 읽어(gongmun.purchase) 초안을 만들고 과제 내용으로 구매사유를 쓴(gongmunReason.purchase) 뒤,
# 공문 탭의 `공문 작성` 을 누르면 이 기록이 선다(gongmunpanel.js writeDoc). 부서 구매는 500만원 미만(부가세 포함 합계 — 레시피 purchase/purpose.yaml 의 limit,
# 2026-10-29 사용자 지정)만 이 틀로 올린다 — 넘으면 패널이 본문을 만들지 않는다(overLimit).
# 어댑터(gongmun.write): writePlan('purchase', { title, body, draft, form, setting, rank, lead, refs } = rec.input, { me: preset.me, preset: preset.setup, project: preset.project, today: preset.today })
# → writeGongmun(plan, { files: ctx.files, onStep, onTab, dry })(§14.4). 첨부 바이트(읽은 문서를 묶은 PDF·원본 파일 — base64)는 ctx.files 이고 기록의 attach 는 이름 목록이다.
# 공통 칸(form·title·body·rank·lead·refs·setting·attach)과 공문 설정(setup)은 _domain.yaml 에 있다 — `{ from: domain }` 이 같은 자리에 가져온다. 이 종류만의 것은 초안(draft)이다.
id: gongmun.purchase
title: 구매품의 작성
summary: '{preset.kindTitle} · {title}'
preset:
  project:   { from: ctx:project, type: object, desc: 고른 과제(이름·별명·번호·Job Id(과제 찾기)·책임자·연구기간·개요·내용·계정·공문 참조자 refs·rnd.year — 공문 탭이 R&D 탭의 과제에서 고른 것. 과제 내용 3000자가 들어 있어 로그에서 뺀다), log: false }
  kindTitle: { from: recipe:purposes.purchase.title, desc: 갈래 이름(레시피 purpose.yaml 의 title — 구매품의) — 활동 로그 한 줄에 쓴다 }
fields:
  form:    { from: domain }
  title:   { from: domain }
  body:    { from: domain }
  # 초안 — 레시피 purchase/purpose.yaml 의 fields(gist·vendor·total·use·reason·summary·account)와 reads(items·quoteDate·supply·vat) 를 생성기가 펼치고 currency·attach 를 더한다(§14.2).
  # 읽는 법(read)·보기(example)는 레시피에 있다. 위임전결(총액 2천만원 이하 팀장·초과 소장 — registries/delegation.yaml 연구비집행)은 어댑터 쪽 writePlan 이 draft.total 로 정한다.
  draft:
    type: object
    from: recipe
    label: 초안
    desc: 초안 칸(레시피 purpose.yaml 의 fields·reads — 생성기가 펼친다). 읽은 문서(gongmun.purchase)와 과제 내용으로 쓴 사유(gongmunReason.purchase)가 채우고 사람이 고친다
    read: 읽은 문서와 과제 내용으로 채운 초안
  rank:    { from: domain }
  lead:    { from: domain }
  refs:    { from: domain }
  setting: { from: domain }
  attach:  { from: domain }
llm:
  tasks:
    - { task: gongmun.purchase, fills: draft }
    - { task: gongmunReason.purchase, fills: draft }
runner: gongmun.write
uses:
  - { module: src/gongmun.js, export: writePlan }
  - { module: src/gmwrite.js, export: writeGongmun }
next: 뒤 탭에 공문을 쓴다(과제·제목·차수·본문·문서설정·결재선·첨부 — 단계마다 onStep). ok 는 steps 에 ok false 가 없을 때다(§14.3). 임시저장·상신은 사람이 창에서 한다 — 패널은 읽어 둔 공문 이력을 묵은 것으로 두어 다음에 다시 읽는다
