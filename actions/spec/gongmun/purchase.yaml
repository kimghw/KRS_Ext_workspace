# 구매품의(연구업무추진품의) 작성 — 견적서·거래명세서·쇼핑몰 주문 화면을 읽어(gongmun.purchase) 초안을 만들고 과제 내용으로 구매사유를 쓴(gongmunReason.purchase) 뒤,
# 공문 탭의 `공문 작성` 을 누르면 이 기록이 선다(gongmunpanel.js writeDoc). 부서 구매는 100만원 이하(부가세 포함 합계 — 레시피 purchase/purpose.yaml 의 limit,
# 2026-10-07 사용자 지정)만 이 틀로 올린다 — 넘으면 패널이 본문을 만들지 않는다(overLimit).
# 어댑터(gongmun.write): writePlan('purchase', { title, body, draft, form, setting, rank } = rec.input, { me: preset.me, preset: preset.setup, project: preset.project, today: preset.today })
# → writeGongmun(plan, { files: ctx.files, onStep, onTab, dry })(§14.4). 첨부 바이트(읽은 문서를 묶은 PDF·원본 파일 — base64)는 ctx.files 이고 기록의 attach 는 이름 목록이다.
id: gongmun.purchase
title: 구매품의 작성
summary: '{preset.kindTitle} · {title}'
preset:
  # 불투명 객체(§14.1 — 사전설정에는 fields 를 두지 않는다). 키는 src/gongmun.js normalizePreset 의 dept(기안 부서)·head(부서장 — 결재)·director(소장)·chief(본부장)·docNo(문서번호 부서 코드)다.
  setup:     { from: storage:gongmunPreset, type: object, required: true, desc: '공문 설정(부서·부서장·소장·본부장·문서번호 부서 — 실명은 여기에만 둔다). 어댑터가 writePlan 의 ctx.preset 으로 그대로 넘긴다 — 문서번호·결재선이 여기서 나온다' }
  project:   { from: ctx:project, type: object, desc: 고른 과제(이름·별명·번호·책임자·연구기간·개요·내용·계정·공문 참조자 refs·rnd.year — 공문 탭이 R&D 탭의 과제에서 고른 것. 과제 내용 3000자가 들어 있어 로그에서 뺀다), log: false }
  kindTitle: { value: 구매품의, desc: 갈래 이름(레시피 purpose.yaml 의 title) — 활동 로그 한 줄에 쓴다 }
fields:
  form:
    type: enum
    required: true
    values: [KR_EA_Research_Task, KR_EA_Form2]
    default: KR_EA_Research_Task
    label: 양식
    desc: eclass 전자결재 양식(src/gongmun.js formsFor('purchase') — 연구업무추진품의가 기본, 기안문은 본문만 있는 양식). 공문 탭의 양식 칸(템플릿)에서 고른다
    read: '품의 양식 — 연구업무추진품의(KR_EA_Research_Task)가 기본. 기안문이라고 했을 때만 KR_EA_Form2'
  title:
    type: string
    required: true
    max: 99
    label: 제목
    desc: 공문 제목(제목 틀을 채운 글 — 전자결재가 99자에서 자른다. 사람이 고쳤으면 그 글)
    read: 제목 틀을 채운 제목. 사용자가 제목을 말했으면 그것
    example: 연구 데이터 저장용 34인치 모니터 외 1건 구매 품의
  body:
    type: string
    required: true
    max: 20000
    label: 본문
    desc: 본문(본문 틀을 채운 글 — src/gongmun.js compose. 사람이 고쳤으면 그 글). 긴 줄표는 어댑터 쪽 writePlan 이 '-' 로 바꾼다(eclassText)
    read: 본문 틀을 채운 글
    llm: false
  # 초안 — 레시피 purchase/purpose.yaml 의 fields(gist·vendor·total·use·reason·summary·account)와 reads(items·quoteDate·supply·vat) 를 생성기가 펼치고 currency·attach 를 더한다(§14.2).
  # 읽는 법(read)·보기(example)는 레시피에 있다. 위임전결(총액 2천만원 이하 팀장·초과 소장 — registries/delegation.yaml 연구비집행)은 어댑터 쪽 writePlan 이 draft.total 로 정한다.
  draft:
    type: object
    from: recipe
    label: 초안
    desc: 초안 칸(레시피 purpose.yaml 의 fields·reads — 생성기가 펼친다). 읽은 문서(gongmun.purchase)와 과제 내용으로 쓴 사유(gongmunReason.purchase)가 채우고 사람이 고친다
    read: 읽은 문서와 과제 내용으로 채운 초안
  rank:
    type: enum
    values: [팀장, 소장, 본부장]
    label: 전결권자
    desc: 이 공문에서 사람이 고른 전결권자 직책(registries/delegation.yaml 의 ranks). 비면 규정대로(연구비집행 — 금액 구간). 고르면 그것이 이긴다(delegationOf 의 overridden)
    read: '사용자가 전결권자(팀장·소장·본부장)를 말했을 때만. 그 밖에는 null(규정대로)'
  # 문서설정에서 이 공문만 바꾼 값 — src/gongmun.js settingPatch 가 받는 키 전부(§14.2). 레시피 defaults < 프로파일(연구품의 — 10년·기안 팀 채번·내부결재·키워드 {과제별명}) < 이것.
  setting:
    type: object
    label: 문서설정
    desc: 이 공문에서 바꾼 문서설정만(없는 키는 레시피·공문 설정대로 — docSettingOf). 전자결재 툴바의 '문서설정' 창에 넣는 값이다
    read: 사용자가 문서설정(보존년한·수신처·공개범위·긴급·검색 키워드 등)을 바꾸라고 했을 때만
    llm: false
    fields:
      retention:     { type: enum, values: ['12', '24', '36', '60', '120', '240', '1200'], desc: 보존년한 코드(1년·2년·3년·5년·10년·20년·영구 — settings.yaml options.retention), read: '보존년한을 말했으면 그 코드(10년이면 120)' }
      docNo:         { type: string, max: 8, desc: '문서번호 부서 코드(Doc No. — ddlDocNo 의 값, 숫자만)', read: '문서번호 부서를 코드로 말했을 때만' }
      receiver:      { type: enum, values: [내부결재, KRE], desc: 수신처(settings.yaml options.receiver), read: '수신처를 말했을 때만 — 내부결재 또는 KRE' }
      scope:         { type: enum, values: [결재선, 기안부서], desc: 공개범위(settings.yaml options.scope — 결재선 YNN·기안부서 NNY), read: '공개범위를 말했을 때만 — 결재선 또는 기안부서' }
      emergency:     { type: boolean, desc: 긴급, read: '긴급이라고 했을 때만 true' }
      approvingOpen: { type: boolean, desc: 진행공개, read: '진행공개라고 했을 때만 true' }
      drm:           { type: boolean, desc: DRM, read: 'DRM 을 걸라고 했을 때만 true' }
      tag:           { type: string, max: 60, desc: 검색 키워드(비면 고른 과제의 별명 — 2026-10-12 사용자 지정 "연구개발 별칭이 있다면 그걸 넣어줘"), read: '검색 키워드를 말했을 때만' }
  # 창의 파일첨부에 올리는 파일 이름 목록(다섯 칸 — src/gmwrite.js ATTACH_SLOTS). 읽은 문서를 첨부 목록의 문서마다 PDF 로 묶은 것(attachPdfs)과 원본 첨부(메일 첨부·문서 파일 — originalFiles)다.
  # 바이트(base64)는 ctx.files 로 간다(§5). 2026-10-08 사용자 지정: "공문에는 견적서 랑,, 강의 내용도 첨부파일로".
  attach:
    type: list
    max: 5
    label: 첨부
    desc: 첨부 파일 이름(바이트는 ctx.files — 이름으로 잇는다). 견적서를 오렸으면(cut) 오린 그림이 앞에 온다
    read: 첨부할 문서의 파일 이름 목록. 지어내지 않습니다
    llm: false
    item:
      name: { type: string, required: true, max: 200, desc: 파일 이름(견적서_업체_날짜.pdf 처럼 attachName 이 지은 것이거나 원본 이름), read: 파일 이름 }
      kind: { type: string, max: 40, desc: '무엇의 문서인지(첨부 목록의 문서 이름 — 견적서·거래명세서·강의 내용 …, 원본 첨부면 original)', read: '무엇의 문서인지. 모르면 null' }
llm:
  tasks:
    - { task: gongmun.purchase, fills: draft }
    - { task: gongmunReason.purchase, fills: draft }
runner: gongmun.write
uses:
  - { module: src/gongmun.js, export: writePlan }
  - { module: src/gmwrite.js, export: writeGongmun }
next: 뒤 탭에 공문을 쓴다(과제·제목·차수·본문·문서설정·결재선·첨부 — 단계마다 onStep). ok 는 steps 에 ok false 가 없을 때다(§14.3). 임시저장·상신은 사람이 창에서 한다 — 패널은 읽어 둔 공문 이력을 묵은 것으로 두어 다음에 다시 읽는다
