# 공문 설정 채우기 — 공문 탭의 채팅 칸에 과제명·과제책임자 등을 붙여 넣으면(과제 목록 표를 복사한 것, 메모, 문장) LLM(gongmunSetup — 레시피 registries/setup.yaml)이나 규칙 해석
# (src/gongmun.js parseSetupLocal)이 낸 조각을 공문 설정에 얹는다(src/gongmun.js mergeSetup — 2026-10-07 사용자 지정). 조각은 부분 수정이다 — 과제는 이름(또는 번호)이 같은 것을
# 고치고 없으면 더한다(열 개까지). 참조자는 받지 않는다(2026-10-15 사용자 지정: 참조자는 과제 YAML 의 공문.참조자에 공문 종류별로).
# **지금 패널에서 부르는 곳이 없다**(src/llm.js gongmunSetupSmart 를 쓰는 자리가 없다 — §13) → status planned. 2단계에 공문 설정 화면의 붙여넣기에 잇는다.
# 어댑터(gongmun.setup): mergeSetup(ctx.rows, rec.preset.setup, rec.input.patch, { current: ctx.current }) — rows(공문 설정 칸의 과제 줄)·current(초안에서 고른 과제 이름)는 ctx 다.
# 저장소에 쓰는 것(gongmunPreset·gongmunProjects)은 패널이 결과(rows·preset)를 받아 한다 — 화면·저장소만 바뀌므로 effect draft, 사람이 누르지 않아도 얹는다(confirm false).
id: gongmun.setup
title: 공문 설정 채우기
status: planned
confirm: false
effect: draft
log: gongmun-setup             # src/logbook.js KIND_LABEL 의 '공문설정'
summary: '공문 설정 채우기'
preset:
  # 불투명 객체 — 키는 src/gongmun.js normalizePreset 의 dept·head·director·chief·docNo.
  setup: { from: storage:gongmunPreset, type: object, desc: '지금의 공문 설정(부서·부서장·소장·본부장·문서번호 부서 — mergeSetup 의 preset. 조각에 없는 칸은 그대로 둔다)' }
fields:
  # gongmunSetup 작업의 출력 키(projects·dept·lead·content·alias·period·head)를 한 칸에 담는다 — 레시피 모드의 llm.tasks 는 칸 하나를 채우므로(fills) 조각 전체를 object 로 둔다.
  patch:
    type: object
    label: 조각
    desc: 공문 설정에 얹을 조각(레시피 registries/setup.yaml 의 keys — 말하지 않은 칸은 없다). 과제 없이 사람·별명·연구기간·내용만 오면 지금 고른 과제(ctx.current) 몫이다
    read: 붙여 넣은 글에서 읽은 공문 설정의 값 — 적힌 것만, 추측하지 않습니다
    fields:
      projects:
        type: list
        max: 10
        desc: 과제 — 글에 나온 과제마다 한 줄(이름·번호·책임자·별명·연구기간·개요·내용). 열 개까지(src/rnd.js MAX_PROJECTS 와 같은 한도 — 2026-10-10 사용자 지정)
        read: '과제. 글에 나온 과제마다 한 줄 — 과제가 나오지 않았으면 null'
        item:
          name:    { type: string, required: true, max: 200, desc: 과제명(전자결재 과제 찾기에 그대로 쓴다), read: 과제명(글에 적힌 그대로), example: MW급 10kV 고전압 직류 시스템용 반도체 차단기 개발 }
          code:    { type: string, max: 40, desc: 과제번호, read: 과제번호, example: RND-20-2026 }
          lead:    { type: string, max: 40, desc: 과제책임자(품의의 합의자 — 이름만), read: 과제책임자 이름 — 직급·존칭은 뗀다, example: 박기도 }
          alias:   { type: string, max: 60, desc: 과제 별명(교육·출장 품의 제목에 들어간다), read: '과제 별명(약칭) — 글에 "별명"·"약칭" 으로 적혀 있을 때만', example: 차단기 과제 }
          period:  { type: string, max: 60, desc: 연구기간(본문 과제 개요에 들어간다), read: 연구기간 — 글에 적힌 그대로, example: 2026.04.01 ~ 2029.12.31 }
          about:   { type: string, max: 300, desc: '과제 개요(본문 첫 줄 — "…을 수행하고 있습니다" 로 끝나는 한 구절)', read: '과제 개요 — 글에 과제의 목적이 적혀 있을 때만' }
          content: { type: string, max: 3000, desc: 과제 내용(연구목표·연구내용 — 품의 사유를 쓰는 근거), read: 과제 내용 — 요약하지 않고 글에 적힌 그대로 }
      dept:    { type: string, max: 100, desc: 기안 부서, read: 기안 부서, example: 연구본부 수소전기추진연구팀 }
      lead:    { type: string, max: 40, desc: 과제 없이 과제책임자(합의자)만 적었을 때 그 이름 — 지금 고른 과제의 합의자가 된다, read: 과제를 말하지 않고 과제책임자(합의자)만 적었을 때 그 이름 }
      content: { type: string, max: 3000, desc: 과제 없이 과제 내용만 붙여 넣었을 때 그 글 — 지금 고른 과제의 내용이 된다, read: 과제를 말하지 않고 과제 내용(연구목표·연구내용)만 붙여 넣었을 때 그 글 }
      alias:   { type: string, max: 60, desc: 과제 없이 별명만 적었을 때 — 지금 고른 과제의 별명, read: 과제를 말하지 않고 과제 별명만 적었을 때 그 별명 }
      period:  { type: string, max: 60, desc: 과제 없이 연구기간만 적었을 때 — 지금 고른 과제의 연구기간, read: 과제를 말하지 않고 연구기간만 적었을 때 그 기간 }
      head:    { type: string, max: 40, desc: 부서장 이름(품의의 결재자), read: 부서장 이름(품의의 결재자), example: 노길태 }
  reply:
    type: string
    max: 300
    desc: 무엇을 채웠는지 한 문장(LLM 의 답 — 화면 칸이 아니다)
    read: 무엇을 채웠는지 한국어 한 문장
    ui: false
llm:
  tasks:
    - { task: gongmunSetup, fills: patch }
runner: gongmun.setup
uses:
  - { module: src/gongmun.js, export: mergeSetup }
  - { module: src/gongmun.js, export: parseSetupLocal }
  - { module: src/llm.js, export: gongmunSetupSmart }
next: mergeSetup 의 결과(rows·preset·done·skipped)를 패널이 공문 설정 칸에 그리고 저장소(gongmunPreset·gongmunProjects)에 담는다. done·skipped 가 상태 줄의 말이다
