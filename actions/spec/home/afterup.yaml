# 홈에서 사후정산 올리기 — 홈 카드가 보관함에 "아직 안 올림"(todo)으로 담아 둔 숙박 증빙·항공권을 넣은 그 자리에서 사후정산에 올린다(src/home.js sendUp → src/afterup.js afterUp,
# 2026-10-04 사용자 지정: "올리면 바로 사후등록 하게 해줘, 항공권도 동일하게"). 패널의 출장 카드(trip.after)와 같은 차례다 — 그때 읽은 기록으로 묶고(다시 읽지 않는다), 사전정산이 아직
# 완료되지 않았으면 확정부터 하고, 숙박비 상한액을 읽어 정산금액을 정한 뒤 올린다. 상한액을 넘으면 올리지 않고 그 줄에 고르는 버튼을 세운다(ask — 2026-10-05 "홈 줄에서 바로 고르기") —
# 고른 것(settle)을 들고 다시 짓는다(pickSettle). 원화 금액을 모르거나 필수 값을 못 읽었으면 남겨 둔다(hold — 패널의 출장 카드에서 올린다). 보관함의 기록·파일은 배경에 부탁한다(evidenceGiven·evidenceFile·evidenceDone).
id: home.afterup
title: 홈에서 사후정산 올리기
status: planned
confirm: true                  # home.evidence 의 누름(then)·`사후정산에 올리기`·고르는 버튼이 확인이다
effect: write
summary: '홈 카드 사후정산 올리기 {seq} · {docNo}'
fields:
  docNo: { type: string, required: true, max: 20, label: 신청서 번호, desc: 그 출장의 HR 신청서 번호(보관함의 열쇠 — todo 증빙을 여기서 꺼낸다), read: 그 출장의 HR 신청서 번호, example: '2026-001234' }
  seq:   { type: string, required: true, max: 20, label: 계산서 번호, desc: 그 출장의 여비계산서 번호(목록 줄 row — 어댑터가 ctx.row 와 같은지 본다. 단계·출장자 번호는 지금 것을 다시 읽는다), read: 여비계산서 번호, example: '145580' }
  settle:
    type: list
    max: 10
    label: 숙박 줄의 결정
    desc: 상한액을 넘는 숙박 줄마다 사람이 고른 것(afterUp 의 settle — lodgeKey → cap·real). 처음에는 비어 있고 ask 에 답한 뒤 담긴다
    read: 사용자가 그 숙박을 상한액으로 할지 실제 금액으로 할지 말했을 때만
    llm: false
    item:
      key:    { type: string, required: true, max: 400, desc: 어느 숙박 줄인가 — 그 줄의 증빙 파일 이름들(src/afterup.js lodgeKey), read: 그 숙박 줄의 증빙 파일 이름(여럿이면 ' | ' 로 이어서) }
      settle: { type: enum, values: [cap, real], required: true, desc: 상한액으로(cap) · 실제 금액으로(real — 1.5배 이내면 부서장 승인), read: '상한액으로 하겠다면 cap, 실제 금액으로 하겠다면 real' }
llm: false
runner: home.afterup
uses:
  - { module: src/afterup.js, export: afterUp }
  - { module: src/after.js, export: afterPlan }
  - { module: src/after.js, export: lodgeChoices }
next: 결과({ ok, sent, hold, text, brief, ask })를 출장 줄에 적는다. ask 가 있으면 줄에 고르는 버튼이 서고 고르면 settle 을 담아 다시 짓는다. 올렸으면 가는 편·오는 편(attendLegs)과 올린 숙박 줄의 표시(attendLodgeMine·attendLodgeActual)를 적어 둔다(remember)
