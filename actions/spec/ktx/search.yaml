# KTX 조회 — 공식 시간표를 확장 안에서 검색하고 코레일 바로가기를 제공한다.
# 말로 찾기(2026-11-06 사용자 지정: "차량 ktx 부분에도 채팅으로 조회 하는거 기능 차량이랑 동일하게 넣어줘")는 per-kind 작업 search.ktx — 답은 조각(partial)이라
# 말하지 않은 칸은 null 이고, 패널(ktxbox.js ask)이 지금 칸의 값 위에 얹어 조회한다. Claude 가 없으면 규칙 해석(src/ktxnlq.js parseKtxLocal) — 둘 다 같은 관문(src/llm.js ktxSmart).
# 칸의 read 가 LLM 지시문이다(node tools/gen-actions.mjs --prompt search.ktx).
id: ktx.search
title: KTX 열차 조회
hint: 코레일 승차권
confirm: false
effect: none
summary: 'KTX {from}→{to} {date} {hour}시~ {adults}명'
fields:
  from:
    type: enum
    required: true
    label: 출발역
    values: [서울, 용산, 영등포, 행신, 광명, 수원, 천안아산, 오송, 대전, 서대전, 김천구미, 서대구, 동대구, 경산, 밀양, 구포, 부산, 경주, 울산(통도사), 포항, 마산, 창원중앙, 논산, 익산, 정읍, 광주송정, 목포, 전주, 순천, 여수EXPO, 강릉, 정동진]
    desc: KTX 조회에 보낼 출발역
    read: '출발역 — 목록의 역 이름 그대로("부산에서"·"부산발"·"부산 출발"). 울산은 "울산(통도사)", 여수는 "여수EXPO", 광주는 "광주송정", 천안은 "천안아산", 구미는 "김천구미", 창원은 "창원중앙", 대구는 "동대구". 말하지 않았으면 null'
    default: 부산
    example: 부산
  to:
    type: enum
    required: true
    label: 도착역
    values: [서울, 용산, 영등포, 행신, 광명, 수원, 천안아산, 오송, 대전, 서대전, 김천구미, 서대구, 동대구, 경산, 밀양, 구포, 부산, 경주, 울산(통도사), 포항, 마산, 창원중앙, 논산, 익산, 정읍, 광주송정, 목포, 전주, 순천, 여수EXPO, 강릉, 정동진]
    desc: KTX 조회에 보낼 도착역
    read: '도착역 — 목록의 역 이름 그대로("서울까지"·"서울행"·"서울 가는"). 역을 하나만 말했으면 그것이 도착역. 말하지 않았으면 null'
    default: 서울
    example: 서울
  date:
    type: date
    required: true
    label: 출발일
    desc: 차량 탭 날짜 줄의 출발일
    read: '출발일(YYYY-MM-DD). "내일"·"다음 주 수요일" 은 입력의 달력에서 찾는다. 말하지 않았으면 null'
    example: '2026-11-12'
  hour:
    type: integer
    required: true
    label: 출발 시
    min: 0
    max: 23
    desc: 이 시각 이후 출발 열차를 조회한다
    read: '출발 시(0~23) — 이 시각 이후 출발하는 열차를 본다. "오후 2시" 는 14, "새벽" 은 5, "아침" 은 7, "오전" 은 9, "오후" 는 12, "저녁" 은 18, "밤" 은 20. 말하지 않았으면 null'
    default: 8
    example: 8
  adults:
    type: integer
    required: true
    label: 인원
    min: 1
    max: 9
    desc: 조회할 어른 인원
    read: '어른 인원(1~9) — "2명"·"둘이"·"두 사람" 은 2, "혼자" 는 1. 말하지 않았으면 null'
    default: 1
    example: 1
rules:
  - 이번 말에서 사용자가 말한 것만 채웁니다. 말하지 않은 칸은 null 입니다 — 지금 조회 칸의 값이 그대로 쓰입니다.
  - '"내일", "다음 주 수요일" 같은 표현은 오늘을 기준으로 실제 날짜로 바꿉니다. 요일은 셈하지 말고 입력의 달력 줄에서 찾습니다. 연도가 없으면 오늘과 같은 해(그 날이 이미 지났으면 다음 해)입니다.'
  - 역은 목록의 이름 그대로 적습니다. 목록에 없는 역(인천·제주 …)은 null 입니다. 출발역과 도착역이 같으면 조회하지 않습니다.
  - 조회는 코레일 공식 시간표의 운행 요일·정차역·출발 시각으로 검색합니다. 좌석 조회나 브라우저 자동화를 하지 않으며 예매는 코레일에서 사람이 합니다.
llm: { task: search.ktx }     # per-kind 작업의 이름 — src/llm.js ktxSmart 가 부른다(말로 찾기, 2026-11-06)
runner: ktx.search
uses:
  - { module: src/ktx.js, export: ktxSearch }
next: 열차 출발·도착 시각과 소요 시간을 표시한다. 코레일 바로가기는 승차권 조회 페이지를 일반 탭으로 연다.
