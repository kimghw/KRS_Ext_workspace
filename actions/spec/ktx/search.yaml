# KTX 조회 — 조건을 기존 네이티브 브릿지의 Python 조회 모듈로 보낸다.
id: ktx.search
title: KTX 열차 조회
hint: 코레일 승차권
confirm: false
effect: none
summary: 'KTX {from}→{to} {date} {hour}시~ {adults}명'
fields:
  from:
    type: enum
    required: true
    label: 출발역
    values: [서울, 용산, 영등포, 행신, 광명, 수원, 천안아산, 오송, 대전, 서대전, 김천구미, 서대구, 동대구, 경산, 밀양, 구포, 부산, 경주, 울산(통도사), 포항, 마산, 창원중앙, 논산, 익산, 정읍, 광주송정, 목포, 전주, 순천, 여수EXPO, 강릉, 정동진]
    desc: KTX 조회에 보낼 출발역
    read: 코레일 출발역 이름. 없으면 부산
    default: 부산
    example: 부산
  to:
    type: enum
    required: true
    label: 도착역
    values: [서울, 용산, 영등포, 행신, 광명, 수원, 천안아산, 오송, 대전, 서대전, 김천구미, 서대구, 동대구, 경산, 밀양, 구포, 부산, 경주, 울산(통도사), 포항, 마산, 창원중앙, 논산, 익산, 정읍, 광주송정, 목포, 전주, 순천, 여수EXPO, 강릉, 정동진]
    desc: KTX 조회에 보낼 도착역
    read: 코레일 도착역 이름. 없으면 서울
    default: 서울
    example: 서울
  date:
    type: date
    required: true
    label: 출발일
    desc: 차량 탭 날짜 줄의 출발일
    read: 출발일(YYYY-MM-DD)
    example: '2026-11-12'
  hour:
    type: integer
    required: true
    label: 출발 시
    min: 0
    max: 23
    desc: 이 시각 이후 출발 열차를 조회한다
    read: 차량 탭의 시작 시간(0~23)
    default: 8
    example: 8
  adults:
    type: integer
    required: true
    label: 인원
    min: 1
    max: 9
    desc: 조회할 어른 인원
    read: 어른 몇 명인지. 없으면 1
    default: 1
    example: 1
rules:
  - 출발역과 도착역이 같으면 조회하지 않는다.
  - 조회는 기존 브릿지의 Python 조회 모듈이 한 번 수행하고, 확장은 코레일 폼을 조작하지 않는다.
  - 좌석 상태는 읽기 전용이며 예약·결제는 사람이 한다.
llm: false
runner: ktx.search
uses:
  - { module: src/ktx.js, export: ktxSearch }
next: 열차 목록과 좌석 상태를 표시한다. 코레일에서 계속을 누르면 해당 조회 화면을 앞으로 열고 사람이 좌석 선택·예매를 진행한다.
