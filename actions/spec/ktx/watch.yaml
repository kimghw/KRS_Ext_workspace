# KTX 빈자리 대기 — 자리가 없고 코레일 예약대기도 안 되는 열차를 골라, 옆 코레일 탭의 결과 화면을 5초 간격으로 다시 읽어 살 수 있는 자리가 나오면 알린다
# (2026-11-10 사용자 지정: "한번에 3개 까지. 예약대기가 안되는 경우만 할거야. 간격은 5초, 1시간 지나면 정지. 차단 안내가 재조회 되면 확인 하고 refresh 하고 그래도 안되면 종료. 알림만. 패널이 열린경우만").
# 열차 하나에 기록 하나·실행 한 번이다 — 실행기는 자리가 나오거나, 1시간이 지나거나, 사람이 멈추거나, 막힐 때까지 돌고 그때 활동 로그 한 줄이 남는다. 같은 조건의 대기는 한 탭을 함께 읽는다(src/ktx.js ktxWatch, 3편까지).
# 스스로 좌석을 고르거나 예매하지 않는다 — "자리가 나면 예약까지"를 켰으면 패널이 준 onFound(ctx)가 ktx.reserve 를 돌리고 그 답이 reserve 로 실린다(2026-11-10). 결과 탭의 손잡이(tabId)·멈춤 신호(signal)·읽을 때마다의 줄(onTick)은 ctx 다 — 기록에 넣지 않는다. 말로 찾기는 없다(사람이 누른 줄에서만 돈다).
id: ktx.watch
title: KTX 빈자리 대기
hint: 코레일 결과 화면을 다시 읽으며 기다린다
confirm: false
effect: none
summary: 'KTX 빈자리 대기 {train} {from}→{to} {date} {hour}시~ {adults}명'
fields:
  from:
    type: enum
    required: true
    label: 출발역
    values: [서울, 용산, 영등포, 행신, 광명, 수원, 천안아산, 오송, 대전, 서대전, 김천구미, 서대구, 동대구, 경산, 밀양, 구포, 부산, 경주, 울산(통도사), 포항, 마산, 창원중앙, 논산, 익산, 정읍, 광주송정, 목포, 전주, 순천, 여수EXPO, 강릉, 정동진]
    desc: 좌석을 조회한 출발역
    read: '출발역 — 패널의 KTX 칸에서 온다. 말로 채우지 않는다'
    default: 부산
    example: 부산
  to:
    type: enum
    required: true
    label: 도착역
    values: [서울, 용산, 영등포, 행신, 광명, 수원, 천안아산, 오송, 대전, 서대전, 김천구미, 서대구, 동대구, 경산, 밀양, 구포, 부산, 경주, 울산(통도사), 포항, 마산, 창원중앙, 논산, 익산, 정읍, 광주송정, 목포, 전주, 순천, 여수EXPO, 강릉, 정동진]
    desc: 좌석을 조회한 도착역
    read: '도착역 — 패널의 KTX 칸에서 온다. 말로 채우지 않는다'
    default: 서울
    example: 서울
  date:
    type: date
    required: true
    label: 출발일
    desc: 차량 탭 날짜 줄의 출발일
    read: '출발일 — 패널의 날짜 줄에서 온다. 말로 채우지 않는다'
    example: '2026-11-12'
  hour:
    type: integer
    required: true
    label: 출발 시
    min: 0
    max: 23
    desc: 좌석을 조회한 출발 시 — 기다리는 열차가 이 조회의 결과 첫 화면에 있어야 한다
    read: '출발 시 — 패널의 시작 시간에서 온다. 말로 채우지 않는다'
    default: 8
    example: 8
  adults:
    type: integer
    required: true
    label: 인원
    min: 1
    max: 9
    desc: 조회한 어른 인원
    read: '어른 인원 — 패널의 KTX 칸에서 온다. 말로 채우지 않는다'
    default: 1
    example: 1
  train:
    type: string
    required: true
    label: 열차 번호
    desc: 빈자리를 기다릴 열차의 번호(숫자 1~4자리)
    read: '열차 번호 — 사람이 대기를 누른 줄에서 온다. 말로 채우지 않는다'
    example: '022'
llm: false
runner: ktx.watch
uses:
  - { module: src/ktx.js, export: ktxWatch }
next: 자리가 나오면 패널이 알린다(줄 표시·소리·시스템 알림). "자리가 나면 예약까지"를 켰으면 ktx.reserve 가 결제 직전 화면까지 잡는다. 아니면 줄을 눌러(ktx.open) 사람이 예매한다.
