# 회신 갱신 — 받은 메일에서 회신을 찾아 열린 항목에 잇는다(mailtrack/panel.js refresh → sync.refresh({ force })): 기다리는 항목이 없으면 조회하지 않고(idle) 시각만 남긴다.
# 새로 이어진 회신은 "확인 필요" 로 서고(설정 requireAccept 면 수락해야 센다) 본문·첨부를 금고에 넣는다. 머리의 `새로고침`, 등록 뒤, 자동 갱신(autoRefreshMin)이 부른다 —
# 사람이 누르지 않아도 돈다(confirm false). Outlook MCP 는 읽기만(effect draft — 장부·금고).
id: mail.refresh
title: 회신 갱신
status: planned
confirm: false
effect: draft
summary: '메일 회신 갱신 ({why})'
fields:
  force: { type: boolean, label: 처음부터, desc: 닫지 않은 모든 항목을 보낸 때부터 다시 훑는다(조회 창 windowDays 안에서), read: '처음부터 다시 찾으라고 했을 때만 true' }
  why:   { type: string, max: 40, label: 까닭, desc: 왜 갱신하는지(새로고침·등록 뒤·자동 — 상태 줄과 활동 로그), read: '왜 갱신하는지 짧게. 모르면 null', llm: false }
llm: false
runner: mail.refresh
uses:
  - { module: mailtrack/sync.js, export: createSync }
  - { module: mailtrack/model.js, export: sinceOf }
next: 결과(fetched·linked·warnings 또는 error — 연결 칩이 그에 맞춰진다)를 머리에 적는다. 갱신이 됐으면 꺼짐·로그인 필요로 남아 있던 칩을 되돌린다
