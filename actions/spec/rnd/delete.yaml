fields:
  id:   { type: string, required: true, max: 40, label: 과제 id, desc: '지울 과제의 id(장부 rndBook 의 projects[].id)', read: 지울 과제의 id — 보고 있는 과제 그대로, llm: false }
  name: { type: string, max: 200, label: 과제명, desc: 지울 과제의 이름(기록용 — 어댑터가 id 의 과제와 같은지 본다), read: 지울 과제의 이름, example: MW급 10kV 고전압 직류 시스템용 반도체 차단기 개발 }
llm: false
runner: rnd.delete
uses:
  - { module: src/rnd.js, export: projectOf }
next: 장부에서 빼고 보고 있는 과제를 첫 과제로 옮겨 저장한다(rndpanel.js save)
