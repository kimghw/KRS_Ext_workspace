# rERP 집행내역 받기 — 이어 둔 rERP 과제의 집행비율·미청구 카드를 받아 스냅샷으로 두고 장부 줄에 넣는다(rndpanel.js refreshErp → src/rnderp.js fetchSnapshot·applySnapshot).
# force 가 아니면 오늘이 든 차년도가 아니거나(지난 차년도는 마지막 조회 그대로) 10분 안(ERP_TTL_MS)이면 건너뛴다. 탭을 열 때·잇고 나서·`새로고침` 이 부른다 — 사람이 누르지 않아도
# 돈다(confirm false). rERP 는 읽기만 한다(effect draft — 장부의 스냅샷). 2026-10-11 구현.
id: rnd.erp.fetch
title: rERP 집행내역 받기
status: planned
confirm: false
effect: draft
summary: 'rERP 집행내역 {prjNo} ({reason})'
preset:
  erp: { from: storage:rndSettings, type: object, desc: R&D 설정(rERP 집행내역 켬·숨긴 비목·더하기 — fetchSnapshot 의 settings). 꺼져 있으면 받지 않는다 }
fields:
  projectId: { type: string, required: true, max: 40, label: 과제 id, desc: 보고 있는 과제의 id, read: 보고 있는 과제의 id, llm: false }
  year:      { type: integer, required: true, min: 1, max: 20, label: 차년도, desc: 보고 있는 차년도(n — 조회 기간이 여기서 나온다), read: '몇 차년도인지(1부터)', example: 2 }
  prjNo:     { type: string, required: true, max: 40, label: rERP 과제번호, desc: 이어 둔 rERP 과제번호(장부 erp.prjNo), read: rERP 과제번호, example: P2026-012 }
  force:     { type: boolean, label: 다시 받기, desc: 10분 안이어도·지난 차년도여도 다시 받는다(잇고 나서·새로고침), read: '새로 받으라고 했을 때만 true' }
  reason:    { type: string, max: 40, label: 까닭, desc: 왜 받는지(잇기·고름·새로고침·탭 열기 — 활동 로그 한 줄에 적힌다), read: '왜 받는지 짧게. 모르면 null', llm: false }
llm: false
runner: rnd.erp.fetch
uses:
  - { module: src/rnderp.js, export: fetchSnapshot }
  - { module: src/rnderp.js, export: applySnapshot }
  - { module: src/rnderp.js, export: isFresh }
next: 스냅샷을 장부 줄에 넣고(applyErp) 합계를 다시 그린다. 실패하면 erp.error 를 두고 칸에 까닭을 보인다
