# 원노트 과제 정보 맞추기 — OneNote MCP(localhost:5005)의 「[R&D 과제 정보] KRS WORKSPACE」 페이지와 장부의 과제 정보(이름·별칭·번호·책임자·기간·차년도 기준·메모)를 맞춘다
# (rndpanel.js noteSync → src/rndnote.js syncInfo — 다른 기기에서도 같은 노트북의 같은 섹션을 고르면 같은 페이지를 쓴다). 찾고(없으면 만들고) 읽어 맞춘 뒤, 장부에 받고 달라졌으면 페이지에 쓴다.
# 원노트 공유를 켜 두면 과제 정보를 고친 뒤 잠깐 뒤에(NOTE_WAIT_MS) 저절로 돈다 — 사람이 누르지 않아도 도는 쓰기다(confirm false, by: auto). 켠 것이 승낙이다(2단계에 통합자가 다시 본다).
id: rnd.note.sync
title: 원노트 과제 정보 맞추기
status: planned
confirm: false                 # 공유를 켠 뒤 저절로 돈다(고침·탭 열기·섹션 고름) — 켜는 스위치가 승낙이다
effect: write                  # OneNote 페이지에 쓴다(MCP)
summary: '원노트 과제 정보 맞춤 ({reason})'
preset:
  note: { from: storage:rndNote, type: object, desc: 원노트 공유 설정과 지난 맞춤의 손잡이(on·sectionId·sectionLabel·pageId·webUrl·memo·del·at — src/rndnote.js normalizeNote). syncInfo 의 memo·del 이 여기서 온다 }
fields:
  sectionId: { type: string, required: true, max: 200, label: 섹션, desc: 과제 정보를 둘 OneNote 섹션 id(설정에서 고른 것 — 다른 기기도 같은 섹션), read: '사용자가 섹션을 골랐을 때 그 id', llm: false }
  reason:    { type: string, max: 40, label: 까닭, desc: 왜 맞추는지(켬·섹션 고름·고침·탭 열기·다시 — 활동 로그 한 줄), read: '왜 맞추는지 짧게. 모르면 null', llm: false }
llm: false
runner: rnd.note.sync
uses:
  - { module: src/rndnote.js, export: syncInfo }
  - { module: src/rndnote.js, export: findPage }
  - { module: src/rndnote.js, export: readPage }
  - { module: src/rndnote.js, export: createPage }
  - { module: src/rndnote.js, export: writeBlock }
  - { module: src/rndnote.js, export: openNote }
next: 받아 고친 것이 있으면 장부를 저장하고, 페이지가 없으면 만들고 달라졌으면 쓴다. 손잡이(pageId·memo·del·at)를 rndNote 에 적는다. 도는 중에 다시 부르면 끝난 뒤 한 번 더 돈다
