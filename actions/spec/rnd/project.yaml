# R&D 과제 더하기·고치기 — 과제 폼(rndpanel.js saveForm): 과제명·별칭(필수 — 칩과 머리에 과제명 대신 보인다, 과제끼리 겹치지 않는다)·과제번호·Job Id·책임자·연구기간·차년도 기준(calendar)·메모.
# Job Id 는 폼의 찾기(rndpanel.js findJob — R&D PMS 과제 목록을 읽기만)가 책임자 먼저·과제명 유사도 0.5 이상으로 후보를 늘어놓고 가장 높은 것을 넣는다(src/jobid.js rankJobs, 2026-10-16).
# 고치면 책임자·연구기간이 바뀐 것은 변경이력에 저절로 한 줄 남고(src/rnd.js projectChanges) 사유만 사람이 적는다. 열 개까지(MAX_PROJECTS). 어디에도 올리지 않는다 — 저장소(rndBook)뿐이다.
id: rnd.project
title: R&D 과제 더하기·고치기
status: planned
confirm: true
effect: draft
summary: 'R&D 과제 {name} ({alias})'
fields:
  id:       { type: string, max: 40, label: 과제 id, desc: 고치는 과제의 id(src/rnd.js newId). 비면 새 과제, read: '고치는 과제의 id. 새 과제면 null', llm: false }
  name:     { type: string, required: true, max: 200, label: 과제명, desc: 과제명(전자결재 과제 찾기에 그대로 쓴다), read: 과제명 — 글에 적힌 그대로, example: MW급 10kV 고전압 직류 시스템용 반도체 차단기 개발 }
  alias:    { type: string, required: true, max: 60, label: 별칭, desc: '별칭(칩·머리·교육/출장 품의 제목의 과제 별명 — 과제끼리 겹치지 않는다, aliasOwner)', read: '과제 별명(약칭). "별명"·"약칭" 으로 적혔거나 사용자가 정한 것', example: 차단기 과제 }
  code:     { type: string, max: 40, label: 과제번호, desc: 과제번호(rERP 잇기의 열쇠 — 국가과제 번호 RS-… 일 수 있다), read: 과제번호, example: RND-20-2026 }
  job:      { type: string, max: 20, label: Job Id, desc: '전자결재 공문의 과제 찾기 번호(R&D PMS 의 Project_ID — RND00202026 꼴). 비우면 공문 작성 때 책임자·과제명 유사도로 고른다(src/gmwrite.js)', read: '사내 과제 Job Id(RND00202026 · RND-20-2026 꼴). 국가과제 번호(RS-…)는 아니다. 적혀 있지 않으면 null', example: RND00202026 }
  lead:     { type: string, max: 40, label: 책임자, desc: 과제책임자(품의의 합의자), read: 과제책임자 이름 — 직급·존칭은 뗀다, example: 박기도 }
  start:    { type: date, label: 시작일, desc: 연구 시작일(차년도를 자르는 기준), read: 연구기간의 시작일(YYYY-MM-DD), example: 2026-04-01 }
  end:      { type: date, label: 종료일, desc: 연구 종료일(시작일보다 앞서면 버린다 — normalizeProject), read: 연구기간의 종료일(YYYY-MM-DD), example: 2029-12-31 }
  calendar: { type: boolean, default: false, label: 차년도 기준, desc: '차년도를 1월 1일로 자르는가(첫 해는 시작일부터 12월 31일까지). 거짓이면 시작일부터 한 해씩(src/rnd.js calendarLabel)', read: '차년도를 1월 1일 기준으로 센다고 했을 때만 true' }
  note:     { type: string, max: 1000, label: 메모, desc: 과제 메모, read: '과제에 적어 둘 메모. 말하지 않았으면 null' }
checks:
  - { left: start, op: '<=', right: end, drop: end, message: 종료일이 시작일보다 앞서 종료일은 뺐습니다 }
llm: false
runner: rnd.project
uses:
  - { module: src/rnd.js, export: normalizeProject }
  - { module: src/rnd.js, export: projectChanges }
  - { module: src/rnd.js, export: aliasOwner }
next: 장부(rndBook)에 넣고 저장한다(rndpanel.js save). 원노트 공유가 켜져 있으면 잠깐 뒤 rnd.note.sync 가 따라온다(noteSoon)
