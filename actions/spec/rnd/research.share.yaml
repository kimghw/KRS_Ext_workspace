# 연구내용 원노트 올리기 — 보고 있는 과제의 연구개발계획서 기록(rerp/research.js — researchPlans, 과제명#차년도)을 「[연구내용] 과제명」 페이지 한 장에 올리고
# (rerp/researchsync.js publish — 표 하나 + base64 JSON) 링크를 복사한다(rndpanel.js shareResearch — 2026-10-14 사용자 지정: "workplace 에 기입한 것을 rerp 에 원노트 주소 링크만 공유하면 동기화").
# kr_ext_rerp 설정의 연구개발계획서 칸에 그 링크를 붙여 넣으면 받아 가고, 그 뒤로 계획서를 다시 넣으면(rnd.yaml) auto 로 페이지를 고쳐 둔다. 섹션은 예상 비용과 같은 RERP 섹션
# (rerp/plussync.js plusResolveSection), 못 정하면 과제 정보 섹션(rndNote.sectionId).
id: rnd.research.share
title: 연구내용 원노트 올리기
status: planned
confirm: true                  # `연구내용 올리기` 버튼이 확인이다. auto(계획서를 다시 넣은 뒤)는 rnd.yaml 의 누름이 승낙이다
effect: write                  # OneNote 페이지에 쓴다(MCP)
summary: '연구내용 원노트 올림 {projectId}'
preset:
  share: { from: storage:researchShare, type: object, desc: '올린 페이지의 손잡이({ [과제명 키]: { pageId, webUrl, title, name, at } } — 있으면 그 페이지를 고친다)', log: false }
fields:
  projectId: { type: string, required: true, max: 40, label: 과제 id, desc: 올릴 과제의 id(장부의 과제 — 과제명·과제번호로 기록을 찾는다), read: 올릴 과제의 id, llm: false }
  auto:      { type: boolean, label: 저절로, desc: 계획서를 다시 넣은 뒤 저절로 다시 올리는 것인가(링크를 복사하지 않는다), read: '사용자가 누른 것이 아니면 true', llm: false }
llm: false
runner: rnd.research.share
# rerp/researchsync.js(RSY.publish·linkText)·rerp/research.js(RS.load·readSnapshot)는 default export 뿐이라(rerp/ 는 고치지 않는다) uses 에 적지 못한다 — 지금 그 일을 하는 자리(rndpanel.js createRndPanel 의 shareResearch)를 적는다.
uses:
  - { module: rndpanel.js, export: createRndPanel }
  - { module: rerp/plussync.js, export: createPlusSync }
next: 올린 페이지(pageId·webUrl·title)를 researchShare 에 적고, 누른 것이면 링크 글(RSY.linkText)을 복사한다
