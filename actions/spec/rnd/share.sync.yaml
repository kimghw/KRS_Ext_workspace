# 공유 (SharePoint) 맞추기 — 과제마다 OneDrive(SharePoint) 공유 폴더(base/<약칭 → Job Id → rERP 과제번호>/)의 연차 파일 <n>차년도.json(과제 정보 project 칸 · 예산 계획 budget · 변경이력 changes · 연구내용 research)과
# 장부를 맞추고, kr_ext_rerp 가 적는 예상비용.json 은 받아 보기만 한다(rndpanel.js runShare → rerp/sharesync.js createShareSync(deps).send({ type:'planSync' }) → rerp/prjdocsync.js run — 장부 ↔ 파일 변환은 src/rndshare.js).
# 2026-10-18 사용자 지정(kr_ext_rerp 에서 먼저 바뀌고 "거기도 이렇게 진행하도록 해줘" — "원노트 공유는 mcp 없어도 되긴하지? … 아니 mcp 없이 grph api 하지 않고 브라우저 토큰으로 하라고" ·
# "onedrive 에 업무/shared 안에 과제별로 .. 약칭으로 없으면 jobid 없으면 임시번호 … 년차별로 1개 파일이고 1개 파일에서 변경사항이랑 다 관리 … 과제 정보랑 등등" · "참여연구원들에게 공유할 수 있게 설정까지 … workspace 에도 경로주면 알아서 동기화").
# 옛 rnd.note.sync(원노트 과제 정보 페이지 — src/rndnote.js)·rnd.research.share(연구내용 원노트 올리기 — rerp/plussync.js)를 이것 하나가 대신한다 — 브라우저의 SharePoint 로그인 쿠키만 쓰고 MCP·Graph 는 없다.
# 공유를 켜 두면 장부를 고친 1.2초 뒤(NOTE_WAIT_MS)·R&D 탭을 열 때(1분 안이면 건너뜀)·공유 폴더 칸을 바꿀 때 저절로 돈다 — 사람이 누르지 않아도 도는 쓰기다(confirm false, 켠 것이 승낙이다. 2단계에 통합자가 다시 본다).
id: rnd.share.sync
title: 공유 (SharePoint) 맞추기
status: planned
confirm: false                 # 공유를 켠 뒤 저절로 돈다(켬·폴더 바꿈·고침·탭 열기·지금 맞추기) — 켜는 스위치가 승낙이다
effect: write                  # SharePoint 폴더의 연차 파일에 쓴다(최소화 작업 창에서 contextinfo → CheckOut → PUT → CheckIn — rerp/spstore.js openWriter). 예상비용.json 은 읽기만(pullOnly)
summary: '공유 (SharePoint) 맞춤 ({reason})'
preset:
  share: { from: storage:rndShare, type: object, desc: '공유 카드의 형편(on·folder·at·memo(과제·예산마다 마지막으로 맞춘 지문과 시각 — 병합 기준 localAt)·del(지운 과제의 묘비 90일)·last·error — src/rndshare.js normalizeShare)' }
fields:
  folder: { type: string, max: 2000, label: 공유 폴더, desc: '밑폴더(base) 주소 — 비우면 내 OneDrive 의 문서/업무/shared(rerp/spstore.js resolveMyFolder — 없으면 만듦). 동료의 base 나 팀 사이트 폴더 주소도 된다', read: '사용자가 공유 폴더 칸에 적은 주소. 비웠으면 null', llm: false }
  reason: { type: string, max: 40, label: 까닭, desc: '왜 맞추는지(켬·폴더·고침·열 때·지금 맞추기 — 활동 로그 한 줄. sharesync 의 reason 은 load·edit·manual)', read: '왜 맞추는지 짧게. 모르면 null', llm: false }
llm: false
runner: rnd.share.sync
uses:
  - { module: rerp/sharesync.js, export: createShareSync }
  - { module: src/rndshare.js, export: projectOf }
  - { module: src/rndshare.js, export: yearOf }
  - { module: src/rndshare.js, export: applyYear }
  - { module: src/rndshare.js, export: applyProject }
  - { module: src/rndshare.js, export: matchProject }
  - { module: rndpanel.js, export: createRndPanel }
next: '받은 칸(project·alias·budget·changes·research)은 장부에 들여 저장하고(saveLocal → src/rndshare.js applyProject·applyYear), 예상 비용은 plannedExpenses 에(받기만 — pullOnly), 결과는 rerp 와 같은 shareState(= planSyncState)·shareIndex 에. 지문·묘비는 rndShare 의 memo·del 에 적는다. 도는 중에 다시 부르면 끝난 뒤 한 번 더 돈다'
