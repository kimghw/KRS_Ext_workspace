# 회의실 말로 찾기 — 문장을 조회 조건으로 바꿔(LLM: search.room 작업, 안 되면 규칙 해석 src/nlq.js parseLocal — 둘 다 같은 관문) 날짜마다 현황을 읽어 빈 시간을 찾는다
# (src/search.js findSlots). 조회뿐이라 확인(confirm)이 없고 effect 도 none 이다. 예약은 사용자가 후보를 누른 뒤의 room.reserve 다.
# 칸은 references/input.yaml 의 parse 작업 그대로다(1단계 호환 — 통합자가 마지막에 parse 를 지운다). 생성된 작업 search.room 의 칸 설명은 read 다.
id: room.search
title: 회의실 빈 시간 찾기
hint: 회의실
confirm: false
effect: none
log: ask
summary: '{summary}'
preset:
  today: { from: today, desc: 오늘(YYYY-MM-DD) — 날짜가 없으면 오늘 하루를 본다 }
fields:
  dateFrom:
    type: date
    label: 조회 시작일
    required: true
    desc: 조회 시작일
    read: 조회 시작일(YYYY-MM-DD). 날짜가 없으면 오늘
    example: '2026-10-20'
  dateTo:
    type: date
    label: 조회 종료일
    required: true
    desc: 조회 종료일(포함)
    read: 조회 종료일(YYYY-MM-DD, 포함). 날짜가 하나면 시작일과 같은 날
    example: '2026-10-21'
  hourFrom:
    type: integer
    label: 조회 시작 시
    required: true
    min: 0
    max: 23
    desc: 하루 중 조회 시작 시
    read: 하루 중 조회 시작 시(0~23). 시간대가 없으면 9
    example: 9
  hourTo:
    type: integer
    label: 조회 종료 시
    required: true
    min: 1
    max: 24
    desc: 하루 중 조회 종료 시
    read: 하루 중 조회 종료 시(1~24). 시간대가 없으면 18
    example: 18
  minSeats:
    type: integer
    label: 최소 좌석 수
    min: 1
    max: 999
    desc: 필요한 최소 좌석 수
    read: '"10명" 처럼 인원이 나오면 그 수. 없으면 null'
    example: 10
  minHours:
    type: number
    label: 최소 시간
    min: 0.5
    max: 24
    desc: 연속으로 필요한 최소 시간
    read: '"2시간짜리" 처럼 필요한 길이가 나오면 그 시간. 없으면 null'
    example: 2
  region:
    type: enum
    label: 지역
    values: [부산, 서울]
    desc: 지역
    read: 지역 — 부산 또는 서울만. 말하지 않았으면 null
    example: 부산
  summary:
    type: string
    label: 요약
    required: true
    max: 200
    desc: 해석한 조건을 한 줄로 요약(한국어)
    read: 사용자가 확인할 수 있게 해석 결과를 한 줄로(한국어)
    example: 10/20~21 부산 10명 이상 2시간
checks:
  - { left: dateFrom, op: '<=', right: dateTo, message: 종료일이 시작일보다 앞섭니다 }
  - { left: hourFrom, op: '<', right: hourTo, message: 종료 시가 시작 시보다 늦어야 합니다 }
rules:
  - 날짜가 없으면 오늘 하루만 조회합니다(dateFrom = dateTo = 오늘).
  - '"내일", "이번 주", "다음 주" 같은 표현은 오늘을 기준으로 실제 날짜로 바꿉니다.'
  - 연도가 없으면 오늘과 같은 해로 봅니다.
  - 시간대가 없으면 hourFrom 9, hourTo 18 로 둡니다.
  - '"10명" 처럼 인원이 나오면 minSeats 에 넣습니다.'
  - '"2시간짜리" 처럼 필요한 길이가 나오면 minHours 에 넣습니다.'
  - 지역은 부산 또는 서울만 가능합니다.
  - summary 는 사용자가 확인할 수 있게 해석 결과를 한 줄로 적습니다.
llm: { task: search.room }     # per-kind 작업의 이름 — src/llm.js parseSmart 가 kind room 일 때 부른다
runner: booking.search
uses:
  - { module: src/search.js, export: findSlots }
next: 후보를 화면에 보인다(renderFound) → 사용자가 누르면 그 탭·날짜·지역으로 옮겨 칸을 골라 두고(applyFound) 예약하기는 room.reserve 다
