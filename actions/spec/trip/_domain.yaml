# 여비계산서(출장 여비 — eclass /BusinessTrip) 갈래. 사전정산(create·presave·preconfirm) → 사후정산(after·postconfirm) → 증빙 송부(send),
# 출장 취소의 계산서 삭제(delete), 사후정산 숙박 줄 손질(lodge — 출장 카드의 숙박비 내역). 실행기는 src/trip.js·src/travel.js·src/after.js·sendbox.js 의 것 그대로이고
# 이 명세는 그 앞에 서는 기록의 꼴이다(docs/actions-design.md §6.6 — actions/runners/trip.js). 사이트의 순서·다시 읽어 판정하기·되돌리기는 옮기지 않는다.
#
# LLM 작업은 만들지 않는다(mode none — §3.4: 여비는 UI 가 모은 값으로만 짓는다. 증빙을 읽는 LLM 작업은 references/input.yaml 의 receipt 가 따로 있고,
# trip.after 의 records 가 그 기록을 받는다). 그래도 칸마다 read 는 둔다 — 2단계 통합 명령창에서 LLM 이 칸 값을 제안할 때 쓴다
# (2026-10-16 사용자 지정: "사용자가 입력하는 칸도 나중에 LLM 을 넣을 수 있게 read 를 준다").
domain: trip
title: 여비계산서
# 활동 로그 kind — attendpanel.js·sendbox.js·lodgebox.js·background.js 가 지금 쓰는 'trip' 그대로(src/logbook.js KIND_LABEL 에는 아직 이름이 없어 'trip' 으로 보인다 — 통합자가 정한다).
log: trip
kinds: [create, presave, preconfirm, postconfirm, after, delete, send, lodge]
preset:
  today: { from: today, desc: 오늘 날짜(YYYY-MM-DD) }
  me:    { from: me, desc: 내 이름(패널 설정의 myName) — 여비계산서 화면이 아는 이름(종류 파일의 tripMe)이 비었을 때 대신 쓴다 }
llm:
  task: trip                   # 이름만 맡아 둔다 — mode none 이라 작업은 만들지 않는다
  mode: none
