# 연구수당 품의의 제목·본문 틀 — 꼴(틀·vars·show)은 purchase/body_spec.yaml 머리말과 같다. 교육·출장처럼 '가. 과제 개요' 를 앞에 두고 '나.' 에 지급 내용을 적는다.
title: '{과제별명} 연구수당 지급 품의'
body: |-
  1. {부서:은} {과제개요}.
  2. 이와 관련하여 아래와 같이 과제 참여연구원에게 연구수당을 지급하고자 하오니 재가하여 주시기 바랍니다.

  ------------ 아   래 ------------

  {차례}. 과제 개요
      {세부차례} 과 제 명 : {과제명}
      {세부차례} 과제번호 : {과제번호?}
      {세부차례} 연구기간 : {연구기간?}
      {세부차례} 과제책임자 : {과제책임자?}
  {차례}. 지급 내용
      {세부차례} 지급대상 : {지급대상}
      {세부차례} 대상기간 : {지급기간}
      {세부차례} 지급기준 : {지급기준?}
      {세부차례} 지급총액 : {지급총액}
      {세부차례} 예산계정 : {계정}
      {세부차례} 지급목적 : {지급목적}
      {세부차례} 지급사유 : {지급사유}

  ※ 첨 부
  {첨부}
vars:
  지급대상: { from: who, desc: 지급 대상(참여연구원 성명) }
  지급기간: { from: [from, to], show: period, desc: '대상 기간과 날수 — 2026. 1. 1. ~ 2026. 6. 30. (181일)' }
  지급기준: { from: basis, desc: 지급 기준 }
  지급총액: { from: total, show: won, desc: 지급 총액 — 3,000,000원 }
  지급목적: { from: purpose, desc: 지급 목적 }
  지급사유: { from: reason, desc: 지급 사유(과제 내용으로 쓴다) }
