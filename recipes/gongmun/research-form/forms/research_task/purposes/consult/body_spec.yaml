# 자문 품의의 제목·본문 틀 — 꼴(틀·vars·show)은 purchase/body_spec.yaml 머리말과 같다. 교육·출장처럼 '가. 과제 개요' 를 앞에 두고 '나.' 에 자문을 적는다.
title: '{과제별명} 수행을 위한 전문가 자문 품의'
body: |-
  1. {부서:은} {과제개요}.
  2. 이와 관련하여 {자문목적:을} 위하여 아래와 같이 전문가 자문을 받고자 하오니 재가하여 주시기 바랍니다.

  ------------ 아   래 ------------

  {차례}. 과제 개요
      {세부차례} 과 제 명 : {과제명}
      {세부차례} 과제번호 : {과제번호?}
      {세부차례} 연구기간 : {연구기간?}
      {세부차례} 과제책임자 : {과제책임자?}
  {차례}. 자문 내용
      {세부차례} 자문주제 : {자문주제}
      {세부차례} 자문위원 : {자문위원}
      {세부차례} 소속·직위 : {소속직위?}
      {세부차례} 자문일자 : {자문기간}
      {세부차례} 자문방식 : {자문방식?}
      {세부차례} 자문장소 : {자문장소?}
      {세부차례} 자 문 료 : {자문료}
      {세부차례} 예산계정 : {계정}
      {세부차례} 자문사유 : {자문사유}

  ※ 첨 부
  {첨부}
vars:
  자문주제: { from: subject, desc: 자문 주제 }
  자문위원: { from: expert, desc: 자문위원 성명 }
  소속직위: { from: affiliation, desc: 자문위원의 소속·직위 }
  자문기간: { from: [from, to], show: period, desc: '자문 일자와 날수 — 2026. 11. 12. (1일), 여러 날이면 2026. 11. 12. ~ 2026. 11. 13. (2일)' }
  자문방식: { from: method, desc: 자문 방식 — 대면·서면·온라인 }
  자문장소: { from: place, desc: 자문 장소 }
  자문료: { from: fee, show: won, desc: 자문료 — 500,000원 }
  자문목적: { from: purpose, desc: 자문 목적 }
  자문사유: { from: reason, desc: 자문 사유(과제 내용으로 쓴다) }
